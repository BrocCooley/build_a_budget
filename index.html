<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe6">
<title>Build a Budget</title>
<meta name="description" content="A two-minute budgeting game about food insecurity: one cashier's paycheck, thirty days, and what's left for food.">
<style>
:root{
  --bg:#f3efe6; --card:#fffdf8; --paper:#fffef9; --ink:#17201c; --muted:#5f665f; --faint:#8b918a; --line:#e3ddd0;
  --accent:#1d6b52; --accent-ink:#ffffff; --accent-soft:#dcebe3; --accent-deep:#124a38;
  --red:#c0331f; --red-soft:#f6ddd7;
  --s1:#17201c; --s2:#3d4641; --s3:#646c67; --s4:#8d938e; --s5:#b6bab4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Charter,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}

/* ---------- Meter ---------- */
.meter{position:sticky;top:0;z-index:10;background:rgba(243,239,230,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 16px 10px;border-bottom:1px solid var(--line);transition:transform .4s var(--ease)}
.meter.idle{transform:translateY(-100%);position:absolute;left:0;right:0;pointer-events:none}
.meter-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.meter-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.day{font:700 11px/1 var(--mono);letter-spacing:.06em;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 9px;white-space:nowrap}
.meter-main{display:flex;align-items:baseline;gap:10px;margin-top:3px;min-height:38px}
.meter-amt{font:700 32px/1.1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:color .3s}
.meter-amt.neg{color:var(--red)}
.meter-amt.bump{animation:bump .45s var(--ease)}
@keyframes bump{30%{transform:scale(1.06)}}
.ebt{font:700 12px/1 var(--mono);color:var(--accent-deep);background:var(--accent-soft);border-radius:6px;padding:5px 7px;align-self:center;animation:pop .5s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.meter-delta{margin-left:auto;font:700 14px/1 var(--mono);font-variant-numeric:tabular-nums;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.meter-delta.show{opacity:1;transform:none}
.meter-delta.down{color:var(--red)}
.meter-delta.up{color:var(--accent)}
.meter-bar{height:5px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.meter-fill{height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .8s var(--ease),background .3s}
.meter-fill.low{background:var(--red)}

/* ---------- Layout ---------- */
main{flex:1;padding:20px 16px 36px}
main.enter{animation:enter .45s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
main.shake{animation:shake .5s ease}
@keyframes shake{15%,55%{transform:translateX(-7px)}35%,75%{transform:translateX(7px)}}
.dots{display:flex;gap:5px;margin:0 0 18px}
.dots i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.dots i.done{background:var(--ink)}
.dots i.now{background:var(--accent)}
.kicker{font:700 11px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h1,h2{font-family:var(--serif);font-weight:700;letter-spacing:-.015em;margin:0}
h1{font-size:44px;line-height:1.02;margin-bottom:16px}
h2{font-size:30px;line-height:1.08;margin-bottom:10px}
p{margin:0 0 14px}
.lead{font-size:17px}
.muted{color:var(--muted)}
.cite{display:block;font-size:11.5px;color:var(--faint);margin-top:3px;font-weight:400}
.small{font-size:14px}
.red{color:var(--red)}
.accent{color:var(--accent)}
.section{margin:26px 0 8px;font:700 11px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- Choice cards ---------- */
.opts{margin-top:18px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:15px 16px 14px;margin:0 0 12px;cursor:pointer;min-height:72px;position:relative;transition:border-color .15s,transform .15s var(--ease),box-shadow .2s,opacity .25s,background .2s;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.opt:hover{border-color:var(--ink);box-shadow:0 6px 18px -10px rgba(0,0,0,.25)}
.opt:active{transform:scale(.98)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.015)}
.opts.locked .opt:not(.picked){opacity:.35}
.opt.nope{border-color:var(--red);background:var(--red-soft);cursor:default;animation:shake .45s ease}
.opt.nope:hover{box-shadow:none}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt-top{display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px}
.opt-top .t{flex:1}
.opt-ico{width:38px;height:38px;border-radius:11px;background:var(--bg);display:grid;place-items:center;flex:none;color:var(--ink)}
.opt.nope .opt-ico{background:#fff;color:var(--red)}
.opt-price{font:700 16px/1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.opt-sub{font-size:14px;color:var(--muted);margin-top:6px}
.opt.nope .opt-sub{color:var(--red);font-weight:600}
.share{display:flex;align-items:center;gap:8px;margin-top:9px;font:600 11.5px/1 var(--mono);color:var(--muted)}
.share .bar{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.share .bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.tag{display:inline-block;font:700 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent-deep);margin-top:9px}
.tag.no{background:var(--red);color:#fff}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:17px 16px;border-radius:16px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:17px;cursor:pointer;margin:0 0 10px;transition:transform .12s,background .2s}
.btn:hover{background:#000}
.btn:active{transform:scale(.98)}
.btn.go{background:var(--accent)}
.btn.go:hover{background:var(--accent-deep)}
.btn.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.secondary:hover{background:var(--card)}
.btn.link{background:none;color:var(--muted);padding:12px;font-size:15px;font-weight:600}
.btn .arr{transition:transform .2s}
.btn:hover .arr{transform:translateX(3px)}
.actions{margin-top:24px}

.note{background:var(--accent-soft);border-radius:14px;padding:13px 15px;font-size:15px;margin:0 0 14px}
.note.bad{background:var(--red-soft)}
.note.plain{background:var(--card);border:1px solid var(--line)}

/* ---------- Intro ---------- */
.hero{padding-top:12px}
.hero h1 span{display:block;animation:rise .7s var(--ease) both}
.hero h1 span:nth-child(2){animation-delay:.15s}
.hero h1 span:nth-child(3){animation-delay:.3s;color:var(--accent)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.who{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 22px}
.who span{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--sans);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 11px 7px 8px}
.who svg.i{width:17px;height:17px}

/* ---------- Phone notification ---------- */
.notif{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:20px;padding:13px 14px;box-shadow:0 14px 34px -16px rgba(0,0,0,.35);margin:4px 0 20px;animation:drop .65s cubic-bezier(.2,1.3,.35,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.96)}}
.notif-icon{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--ink)}
.notif-icon.red{background:var(--red)}
.notif-icon.green{background:var(--accent)}
.notif-body{flex:1;min-width:0}
.notif-head{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600}
.notif-title{font-weight:700;font-size:15.5px;margin-top:2px}
.notif-text{font-size:14.5px;color:var(--ink)}

/* ---------- Autopay ---------- */
.auto{list-style:none;padding:0;margin:16px 0}
.auto li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);animation:rise .5s var(--ease) both}
.auto li:nth-child(2){animation-delay:.12s}.auto li:nth-child(3){animation-delay:.24s}.auto li:nth-child(4){animation-delay:.36s}
.auto .ico{width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.auto .tot{border-bottom:0;font-weight:700}
.auto .amt{margin-left:auto;font-family:var(--mono);font-weight:700}

/* ---------- EBT card ---------- */
.ebtcard{position:relative;aspect-ratio:1.6;max-width:300px;border-radius:18px;padding:18px 20px;color:#fff;background:linear-gradient(135deg,#25805f 0%,#1d6b52 45%,#124a38 100%);box-shadow:0 18px 36px -18px rgba(18,74,56,.7);margin:6px 0 20px;overflow:hidden;animation:cardin .8s cubic-bezier(.2,1.2,.35,1) both}
@keyframes cardin{from{opacity:0;transform:rotate(-6deg) translateY(30px) scale(.9)}}
.ebtcard::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.ebtcard .chip{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#e9d9a6,#c7b06b);margin:14px 0 10px}
.ebtcard .lbl{font:700 12px/1 var(--mono);letter-spacing:.14em;opacity:.85}
.ebtcard .bal{font:800 34px/1 var(--mono);letter-spacing:-.02em}
.ebtcard .foot{position:absolute;left:20px;bottom:16px;font:600 11px/1 var(--mono);letter-spacing:.1em;opacity:.8}

/* ---------- Dot / meal grids ---------- */
.g100{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin:12px 0 8px;max-width:340px}
.g100 i{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--s5);transition:background .3s,border-color .3s}
.g100 i.on{background:var(--accent);border-color:var(--accent)}
.g100 i.red{background:var(--red);border-color:var(--red)}
.figure{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:0 0 14px}
.figure .cap{font-size:14px;color:var(--ink);margin:0}

.meals{display:grid;grid-template-columns:repeat(30,1fr);grid-template-rows:repeat(6,auto);grid-auto-flow:column;gap:2px;margin:10px 0 6px}
.meals i{aspect-ratio:1;border-radius:2px;background:var(--accent);transition:background .2s}
.meals i.x{background:var(--red)}
.meals-key{display:flex;justify-content:space-between;font:600 11px/1.3 var(--mono);color:var(--muted)}

/* ---------- Bars ---------- */
.hbar{margin:10px 0}
.hbar .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.hbar .row b{font-family:var(--mono)}
.hbar .track{height:14px;background:var(--bg);border-radius:7px;overflow:hidden}
.hbar .track i{display:block;height:100%;width:0;border-radius:7px;background:var(--ink);transition:width 1s var(--ease)}
.hbar .track i.acc{background:var(--accent)}
.hbar .track i.red{background:var(--red)}

.stack{position:relative;display:flex;height:34px;border-radius:9px;overflow:hidden;background:var(--bg);margin:12px 0 4px}
.stack i{height:100%;transition:width 1s var(--ease)}
.stack i.over{background:repeating-linear-gradient(-45deg,var(--red) 0 6px,#d9614f 6px 12px)}
.stack-mark{position:relative;height:16px;font:600 10.5px/1 var(--mono);color:var(--muted)}
.stack-mark span{position:absolute;top:2px;transform:translateX(-100%);white-space:nowrap;padding-right:4px;border-right:2px solid var(--ink);height:14px;display:flex;align-items:center}
.legend{list-style:none;padding:0;margin:8px 0 0;font-size:14px}
.legend li{display:flex;align-items:center;gap:9px;padding:5px 0}
.legend .sw{width:12px;height:12px;border-radius:3px;flex:none}
.legend .v{margin-left:auto;font-family:var(--mono);font-weight:700}
.legend .p{width:44px;text-align:right;font:600 12px/1 var(--mono);color:var(--muted)}

/* ---------- Food ---------- */
.plate{display:flex;align-items:center;gap:16px;margin:6px 0 14px}
.plate svg{width:76px;height:76px;flex:none}
.plate .amt{font:800 44px/1 var(--mono);letter-spacing:-.03em}
.plate .per{font:600 12px/1.3 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:14px 0 10px}
.cal div{aspect-ratio:1;border-radius:9px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font:600 12px/1 var(--mono);color:var(--faint);transition:background .25s,color .25s,border-color .25s,transform .25s var(--ease)}
.cal div.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cal div.off{background:var(--red-soft);border-color:transparent;color:var(--red);text-decoration:line-through}
.cal div.last{transform:scale(1.12);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--red)}
.cal-key{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:16px}
.cal-key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.verdict{font-family:var(--serif);font-size:30px;line-height:1.1;font-weight:700;margin:4px 0 12px;opacity:0;transition:opacity .4s}
.verdict.show{opacity:1}

/* ---------- Results ---------- */
.big{font:800 64px/0.95 var(--sans);letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin:6px 0 6px}
.headline{font-family:var(--serif);font-size:32px;line-height:1.07;font-weight:700;margin:0 0 14px}
details.rec{margin:8px 0 0}
details.rec summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none;display:flex;align-items:center;gap:8px}
details.rec summary::-webkit-details-marker{display:none}
details.rec summary::after{content:"+";margin-left:auto;font:700 20px/1 var(--mono)}
details.rec[open] summary::after{content:"−"}
.receipt{position:relative;background:var(--paper);font:13.5px/1.55 var(--mono);padding:20px 18px 24px;margin:4px 0 26px;box-shadow:0 10px 24px -14px rgba(0,0,0,.3);animation:print 1s var(--ease) both}
@keyframes print{from{clip-path:inset(0 0 100% 0);transform:translateY(-12px)}to{clip-path:inset(0 0 -20px 0);transform:none}}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;background:radial-gradient(circle at 7px 10px,transparent 6.5px,var(--paper) 7px) 0 0/14px 10px repeat-x}
.receipt h3{font:700 13px/1.3 var(--mono);text-align:center;letter-spacing:.14em;margin:0}
.receipt .sub{text-align:center;color:var(--muted);font-size:12px;margin:2px 0 12px}
.receipt .rl{display:flex;gap:6px;align-items:baseline}
.receipt .rl .d{flex:1;border-bottom:1px dotted #bdb6a6;transform:translateY(-4px)}
.receipt .rl.tot{font-weight:700}
.receipt hr{border:0;border-top:1px dashed #bdb6a6;margin:8px 0}
.receipt .due{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;margin-top:10px}
.stamp{display:inline-block;transform:rotate(-8deg);border:2.5px solid var(--red);color:var(--red);font:800 15px/1 var(--mono);letter-spacing:.08em;padding:6px 8px;border-radius:6px;animation:stamp .35s .9s cubic-bezier(.3,1.6,.5,1) both}
.stamp.ok{border-color:var(--accent);color:var(--accent)}
@keyframes stamp{from{opacity:0;transform:rotate(-8deg) scale(1.8)}to{opacity:.9;transform:rotate(-8deg) scale(1)}}

/* ---------- Final ---------- */
.stat .big{font-size:76px}
.stat p{font-size:17px}
.closing{font-family:var(--serif);font-size:24px;line-height:1.2;font-weight:700;margin:22px 0 4px}
.credit{text-align:center;font:600 12px/1.4 var(--mono);letter-spacing:.06em;color:var(--faint);margin:28px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.sources{padding-left:18px;margin:0 0 16px}
.sources li{margin:0 0 12px;font-size:14px;word-break:break-word}
.sources a{color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 16px}

/* ---------- Edit panel (only with ?edit) ---------- */
#editor{position:fixed;left:0;top:0;bottom:0;width:380px;background:#fff;border-right:1px solid var(--line);z-index:60;display:flex;flex-direction:column;font:14px/1.4 var(--sans);transition:transform .3s var(--ease);box-shadow:8px 0 30px -20px rgba(0,0,0,.3)}
body.editing{padding-left:380px}
.ed-top{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.ed-top h4{margin:0 0 4px;font:700 16px/1.2 var(--sans)}
.ed-top p{margin:0 0 10px;color:var(--muted);font-size:12.5px}
.ed-btns{display:flex;gap:8px;margin-bottom:10px}
.ed-btns button,.ed-tabs button{flex:1;padding:9px 10px;border-radius:9px;border:1.5px solid var(--ink);background:#fff;font-weight:700;font-size:13px;cursor:pointer}
.ed-btns button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
#editor select,#editor input,#editor textarea{width:100%;font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
#editor textarea{resize:vertical;min-height:40px}
#editor input:focus,#editor textarea:focus,#editor select:focus{outline:none;border-color:var(--accent)}
.ed-tabs{display:flex;gap:6px;margin-top:8px}
.ed-tabs button{border-color:var(--line)}
.ed-tabs button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.ed-list{flex:1;overflow:auto;padding:6px 16px 30px}
.ed-group{font:700 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.ed-f{display:block;margin:0 0 10px}
.ed-l{display:flex;align-items:center;gap:6px;font:600 12px/1.3 var(--mono);color:var(--muted);margin-bottom:4px;word-break:break-all}
.ed-l .chg{display:none;width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.ed-f.changed .ed-l .chg{display:inline-block}
.ed-f.changed .ed-l{color:var(--accent-deep)}
.ed-l .rs{margin-left:auto;display:none;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font:600 11px/1 var(--sans)}
.ed-f.changed .ed-l .rs{display:inline}
.ed-count{font-size:12px;color:var(--muted)}
#edToggle{display:none;position:fixed;left:12px;bottom:12px;z-index:70;padding:12px 16px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-weight:700;box-shadow:0 8px 20px -8px rgba(0,0,0,.5);cursor:pointer}
@media (max-width:900px){
  body.editing{padding-left:0}
  #editor{width:min(92vw,380px);transform:translateX(-102%)}
  #editor.open{transform:none}
  #edToggle{display:block}
}

@media (max-width:360px){ h1{font-size:38px} h2{font-size:26px} .big{font-size:54px} }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <header class="meter idle" id="meter" aria-live="polite">
    <div class="meter-row">
      <span class="meter-label" id="meterLabel">Money left this month</span>
      <span class="day" id="day">DAY 1 / 30</span>
    </div>
    <div class="meter-main">
      <span class="meter-amt" id="meterAmt">$0</span>
      <span class="ebt" id="ebt" hidden></span>
      <span class="meter-delta" id="meterDelta"></span>
    </div>
    <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
  </header>
  <main id="screen"></main>
</div>

<script>
/* =====================================================================
   CONFIG — every number used in the game lives here.
   Each value has its source. Items marked ESTIMATE are approximations.
   (Easiest way to change things: open the game with ?edit at the end of the URL.)
   ===================================================================== */

/* =====================================================================
   CALCULATIONS — pure functions (also used by test-paths.js)
   ===================================================================== */
// <calc>
function takeHomeFor(wage) {
  const gross = wage * CONFIG.hoursPerYear / 12;
  return { gross, net: gross * (1 - CONFIG.payrollTaxRate) };
}

function cardPayoff() {
  const s = CONFIG.surprise;
  let bal = s.amount, months = 0, total = 0;
  const r = s.cardAPR / 12;
  while (bal > 0.005 && months < 600) {
    bal += bal * r;
    const p = Math.min(s.cardMonthlyPayment, bal);
    bal -= p; total += p; months++;
  }
  return { months, total };
}

function surpriseCost(choice) {
  if (choice === "pay") return CONFIG.surprise.amount;
  if (choice === "card") return CONFIG.surprise.cardMonthlyPayment;
  return 0;
}

// Monthly SNAP benefit (federal formula). Returns 0 if over the gross income limit.
function snapBenefit(gross, rent, childCare) {
  const s = CONFIG.snap;
  if (gross > s.grossLimit2Person) return 0;
  const adjusted = Math.max(0, gross * (1 - s.earnedIncomeDeduction) - s.standardDeduction - childCare);
  const excessShelter = Math.min(s.excessShelterCap, Math.max(0, rent - adjusted / 2));
  const netIncome = Math.max(0, adjusted - excessShelter);
  return Math.max(0, Math.floor(s.max2Person - Math.ceil(s.benefitReduction * netIncome)));
}

function pathAtWage(city, c, wage) {
  const { gross, net } = takeHomeFor(wage);
  const housing = city.rent[c.housing];
  const care = city.childCare[c.care];
  const transport = c.transport === "car" ? CONFIG.transport.carMonthly : city.busPass;
  const basics = CONFIG.basicsMonthly;
  const surprise = surpriseCost(c.surprise);
  const leftover = net - housing - care - transport - basics - surprise;   // cash left after bills
  const snap = snapBenefit(gross, housing, care);                         // can only be spent on food
  const foodMoney = snap + Math.max(0, leftover);
  const need = CONFIG.food.usdaMonthly * (c.transport === "bus" ? 1 + CONFIG.food.convenienceMarkup : 1);
  const foodGap = Math.max(0, need - foodMoney);                          // short on groceries
  const billsBehind = Math.max(0, -leftover);                             // short on rent/bills (SNAP can't pay these)
  const shortfall = foodGap + billsBehind;
  const gap = shortfall > 0 ? shortfall : need - foodMoney;               // > 0 short, <= 0 = money to spare
  const gapNoSnap = need - leftover;                                      // same path, no SNAP
  const days = CONFIG.daysInMonth;
  const daysFed = Math.min(days, Math.floor(foodMoney / need * days));    // days the food budget covers
  const totalMeals = days * CONFIG.food.people * CONFIG.food.mealsPerDay;
  const perMeal = need / totalMeals;                                      // $ per person per meal
  const mealsSkipped = Math.min(totalMeals, Math.round(foodGap / perMeal));
  return { wage, gross, net, housing, care, transport, basics, surprise, leftover, snap, foodMoney, need, foodGap, billsBehind, gap, gapNoSnap, daysFed, totalMeals, perMeal, mealsSkipped };
}

function computePath(cityKey, c, wageOverride) {
  const city = CONFIG.cities[cityKey];
  const wage = wageOverride != null ? wageOverride : city.wage;
  const r = pathAtWage(city, c, wage);
  r.conscious = (c.housing === "oneBR") + (c.care === "home") + (c.transport === "bus") + (c.surprise === "pay");
  // Lowest wage (to the cent) that closes the gap. Scanned, because SNAP shrinks as pay rises
  // and drops to $0 at the income limit, so the relationship isn't a straight line.
  r.wageToClose = null;
  if (r.gap > 0) {
    for (let cents = Math.round(wage * 100) + 1; cents <= 10000; cents++) {
      if (pathAtWage(city, c, cents / 100).gap <= 0) { r.wageToClose = cents / 100; break; }
    }
  }
  return r;
}

let meterShown = 0, meterRaf = null, deltaTimer = null;
function meterMax() { return S.city ? takeHomeFor(S.wageOverride ?? city().wage).net : 1; }
function cashBalance() {
  if (!S.city) return null;
  const c = S.c, ct = city();
  let bal = meterMax();
  if (c.housing) bal -= ct.rent[c.housing];
  if (c.care) bal -= ct.childCare[c.care];
  if (c.transport) bal -= c.transport === "car" ? CONFIG.transport.carMonthly : ct.busPass;
  if (c.basics) bal -= CONFIG.basicsMonthly;
  if (c.surprise) bal -= surpriseCost(c.surprise);
  return bal;
}
function updateMeter() {
  const m = $("meter"), amt = $("meterAmt"), fill = $("meterFill"), d = $("meterDelta"), ebt = $("ebt");
  $("meterLabel").textContent = TEXT["meter.label"];
  const target = cashBalance();
  const inGame = target != null && (FLOW.includes(S.screen) || S.screen === "results");
  m.classList.toggle("idle", !inGame);
  if (!inGame) return;
  $("day").textContent = `DAY ${DAY[S.screen] || 1} / ${CONFIG.daysInMonth}`;
  if (S.c.snap) { const s = path().snap; ebt.hidden = false; ebt.textContent = s > 0 ? `+ ${fmt(s)} EBT` : "EBT $0"; }
  else ebt.hidden = true;
  const pctLeft = target / meterMax() * 100;
  fill.style.width = Math.max(0, Math.min(100, pctLeft)) + "%";
  fill.classList.toggle("low", pctLeft < 15);
  const from = meterShown, diff = target - from;
  if (Math.abs(diff) < 0.5) { amt.textContent = fmt(target); return; }
  d.textContent = (diff < 0 ? "−" : "+") + fmt(Math.abs(diff));
  d.className = "meter-delta show " + (diff < 0 ? "down" : "up");
  clearTimeout(deltaTimer); deltaTimer = setTimeout(() => d.classList.remove("show"), 1700);
  amt.classList.remove("bump"); void amt.offsetWidth; amt.classList.add("bump");
  cancelAnimationFrame(meterRaf);
  const dur = reduceMotion ? 0 : 800, t0 = performance.now();
  const tick = (now) => {
    const k = dur ? Math.min(1, (now - t0) / dur) : 1;
    const v = k < 1 ? from + diff * (1 - Math.pow(1 - k, 3)) : target;
    meterShown = v;
    amt.textContent = fmt(v);
    amt.classList.toggle("neg", v < -0.5);
    if (k < 1) meterRaf = requestAnimationFrame(tick);
  };
  meterRaf = requestAnimationFrame(tick);
}

/* ---------- Building blocks ---------- */
const dots = () => {
  const i = FLOW.indexOf(S.screen);
  return `<div class="dots" aria-label="Step ${i + 1} of ${FLOW.length}">${FLOW.map((_, k) => `<i class="${k < i ? "done" : k === i ? "now" : ""}"></i>`).join("")}</div>`;
};
// Choice card: icon, title, price, sub-line, paycheck-share bar, tag
function opt({ act, val, ico, title, price, sub, cost, tag, tagCls }) {
  const share = cost != null && S.city
    ? `<div class="share"><span class="bar"><i style="width:${Math.min(100, cost / meterMax() * 100)}%"></i></span><span>${t("share", { pct: pct(cost, meterMax()) })}</span></div>` : "";
  return `<button class="opt" data-act="${act}" data-val="${val}">
    <div class="opt-top">${ico ? `<span class="opt-ico">${icon(ico)}</span>` : ""}<span class="t">${title}</span><span class="opt-price">${price}</span></div>
    ${sub ? `<div class="opt-sub">${sub}</div>` : ""}${share}${tag ? `<span class="tag ${tagCls || ""}">${tag}</span>` : ""}</button>`;
}
const notif = (ico, cls, app, title, text) =>
  `<div class="notif" role="status"><div class="notif-icon ${cls}">${icon(ico)}</div><div class="notif-body"><div class="notif-head"><span>${app}</span><span>now</span></div><div class="notif-title">${title}</div><div class="notif-text">${text}</div></div></div>`;
const next = (to, label, cls = "") => `<button class="btn ${cls}" data-act="next" data-val="${to}">${label} <span class="arr">→</span></button>`;
const cite = (s) => s ? `<span class="cite">(${s})</span>` : "";
const grid100 = (n, cls = "on") => `<div class="g100">${Array.from({ length: 100 }, (_, i) => `<i class="${i < n ? cls : ""}"></i>`).join("")}</div>`;
const hbar = (label, value, frac, cls) =>
  `<div class="hbar"><div class="row"><span>${label}</span><b class="${cls === "red" ? "red" : ""}">${value}</b></div><div class="track"><i class="${cls || ""}" data-w="${Math.max(0, Math.min(100, frac * 100))}"></i></div></div>`;
function growBars() {
  requestAnimationFrame(() => setTimeout(() => {
    document.querySelectorAll("[data-w]").forEach((el) => { el.style.width = el.dataset.w + "%"; });
  }, 80));
}

  results() {
    const r = path();
    const c = city();
    const short = r.gap > 0;
    const p = cardPayoff();
    const dayTxt = `<span class="red">day ${r.daysFed + 1}</span>`;

    // Headline + meals graphic
    const meals = Array.from({ length: r.totalMeals }, (_, i) => `<i class="${i >= r.totalMeals - r.mealsSkipped ? "x" : ""}"></i>`).join("");
    const mealsFig = `<div class="figure"><div class="meals">${meals}</div><div class="meals-key"><span>Day 1</span><span>${t("results.mealsKey")}</span><span>Day ${CONFIG.daysInMonth}</span></div></div>`;
    let head;
    if (r.foodGap > 0) {
      head = `<p class="headline">${t("results.leadShort", { day: dayTxt })}</p>
        <div class="big red">${r.mealsSkipped}</div>
        <p class="lead" style="margin-bottom:8px"><b>${t("results.mealsSkipped")}</b></p>
        ${mealsFig}
        <p>${t("results.mealsNote", { gap: fmt(r.foodGap) })}${r.billsBehind > 0 ? " " + t("results.billsToo", { amount: `<span class="red">${fmt(r.billsBehind)}</span>` }) : ""}</p>`;
    } else if (r.billsBehind > 0) {
      head = `<p class="headline">${t("results.leadBills")}</p>
        <div class="big red">${fmt(r.billsBehind)}</div>
        <p class="lead"><b>${t("results.billsBehind")}</b></p>
        ${mealsFig}`;
    } else {
      head = `<p class="headline">${r.gap > -1 ? t("results.leadZero") : t("results.leadOk", { amount: `<span class="accent">${fmt(-r.gap)}</span>` })}</p>
        ${mealsFig}<p class="small muted">${t("results.mealsAll", { total: r.totalMeals })}</p>`;
    }

    // With vs. without SNAP
    const ns = r.gapNoSnap, ws = r.gap;
    const mx = Math.max(Math.abs(ns), Math.abs(ws), 1);
    const lbl = (g) => g > 0 ? `${fmt(g)} ${t("results.short")}` : `${fmt(-g)} ${t("results.spare")}`;
    const snapFig = `<p class="section">${t("results.snapTitle")}</p><div class="figure">
      ${hbar(t("results.withoutSnap"), lbl(ns), Math.abs(ns) / mx, ns > 0 ? "red" : "acc")}
      ${hbar(`${t("results.withSnap")} <span class="muted small">(+${fmt(r.snap)})</span>`, lbl(ws), Math.abs(ws) / mx, ws > 0 ? "red" : "acc")}
    </div>`;

    // Where the paycheck went (stacked bar)
    const surpriseLabel = { pay: t("label.surprisePay"), card: t("label.surpriseCard"), skip: t("label.surpriseSkip") }[S.c.surprise];
    const items = [
      [t("label.rent"), r.housing, "var(--s1)"],
      [t("label.care"), r.care, "var(--s2)"],
      [S.c.transport === "car" ? t("label.car") : t("label.bus"), r.transport, "var(--s3)"],
      [t("label.basics"), r.basics, "var(--s4)"],
      [surpriseLabel, r.surprise, "var(--s5)"]
    ].filter((x) => x[1] > 0);
    const spent = items.reduce((a, x) => a + x[1], 0);
    const scale = Math.max(r.net, spent);
    const foodCash = Math.max(0, r.leftover);
    const over = Math.max(0, spent - r.net);
    const segs = items.map((x) => `<i style="width:0;background:${x[2]}" data-w="${x[1] / scale * 100}"></i>`).join("")
      + (foodCash > 0 ? `<i style="width:0;background:var(--accent)" data-w="${foodCash / scale * 100}"></i>` : "");
    const overSeg = over > 0 ? `<i class="over" style="position:absolute;top:0;bottom:0;left:${r.net / scale * 100}%;width:${over / scale * 100}%"></i>` : "";
    const legend = items.map((x) => `<li><span class="sw" style="background:${x[2]}"></span>${x[0]}<span class="v">${fmt(x[1])}</span><span class="p">${pct(x[1], r.net)}</span></li>`).join("")
      + (foodCash > 0 ? `<li><span class="sw" style="background:var(--accent)"></span>${t("label.food")}<span class="v">${fmt(foodCash)}</span><span class="p">${pct(foodCash, r.net)}</span></li>` : "")
      + (over > 0 ? `<li class="red"><span class="sw" style="background:var(--red)"></span>${t("results.over")}<span class="v">${fmt(over)}</span><span class="p"></span></li>` : "");
    const whereFig = `<p class="section">${t("results.whereTitle")} · ${fmt(r.net)}</p><div class="figure">
      <div class="stack">${segs}${overSeg}</div>
      ${over > 0 ? `<div class="stack-mark"><span style="left:${r.net / scale * 100}%">${t("results.paycheckEnds")}</span></div>` : ""}
      <ul class="legend">${legend}</ul></div>`;

    const owed = S.c.surprise === "card"
      ? t("results.owedCard", { payment: fmt(CONFIG.surprise.cardMonthlyPayment), months: p.months - 1, total: fmt(p.total) })
      : S.c.surprise === "skip" ? (S.c.transport === "car" ? t("results.owedSkipCar") : t("results.owedSkipDental")) : "";
    const raiseLine = S.wageOverride ? `<div class="note">${t("results.raise", { wage: fmtWage(S.wageOverride), diff: fmtWage(S.wageOverride - c.wage), oldWage: fmtWage(c.wage) })}</div>` : "";
    const ctx = c.stateMinWageNote && !S.wageOverride ? `<p class="small muted">${t("results.context", { note: c.stateMinWageNote })}${cite("U.S. DOL")}</p>` : "";

    const rl = (l, v, cls = "") => `<div class="rl ${cls}"><span>${l}</span><span class="d"></span><span>${v}</span></div>`;
    const receipt = `<details class="rec"><summary>${t("results.receipt")}</summary><div class="receipt">
        <h3>ONE MONTH</h3>
        <div class="sub">${c.name.toUpperCase()} · ${fmtWage(r.wage)}/HR · 40 HRS/WK</div>
        ${rl("TAKE-HOME PAY", fmt(r.net))}<hr>
        ${items.map((x) => rl(x[0].toUpperCase(), "−" + fmt(x[1]))).join("")}<hr>
        ${rl("CASH LEFT", fmt(r.leftover), "tot")}
        ${rl("SNAP / EBT", "+" + fmt(r.snap))}
        ${rl("FOOD NEEDED", "−" + fmt(r.need))}<hr>
        <div class="due">${short ? `<span class="stamp">SHORT</span>` : `<span class="stamp ok">LEFT OVER</span>`}<span class="${short ? "red" : "accent"}">${fmt(Math.abs(r.gap))}</span></div>
      </div></details>`;

    growBars();
    const other = S.city === "fargo" ? "minneapolis" : "fargo";
    return `<p class="kicker">${t("results.choices", { n: r.conscious })}</p>
      ${head}
      ${owed ? `<div class="note bad">${owed}</div>` : ""}
      ${raiseLine}
      ${snapFig}
      ${whereFig}
      ${ctx}
      ${receipt}
      <div class="actions">
        ${next("final", t("results.next"), "go")}
        ${short && r.wageToClose ? `<button class="btn secondary" data-act="raise" data-val="${r.wageToClose}">${t("results.raiseBtn", { wage: fmtWage(r.wageToClose) })}</button>` : ""}
        <button class="btn secondary" data-act="otherCity">${t("results.otherCity", { city: CONFIG.cities[other].name.split(",")[0] })}</button>
        <button class="btn link" data-act="replay">${t("results.replay")}</button>

        <li>Economic Policy Institute, via <i>Minnesota Reformer</i> (2025). <i>Cost of child care in Minnesota.</i> <a href="https://minnesotareformer.com/" target="_blank" rel="noopener">minnesotareformer.com</a></li>
        <li>U.S. Department of Agriculture, Food and Nutrition Service. <i>USDA Food Plans: Cost of Food Report (Thrifty Food Plan), January 2026.</i> <a href="https://www.fns.usda.gov/cnpp/usda-food-plans-cost-food-monthly-reports" target="_blank" rel="noopener">fns.usda.gov</a></li>
        <li>U.S. Department of Agriculture, Food and Nutrition Service. <i>SNAP Fiscal Year 2027 Cost-of-Living Adjustments.</i> <a href="https://www.fns.usda.gov/snap/allotment/cola" target="_blank" rel="noopener">fns.usda.gov</a></li>
        <li>North Dakota Department of Health and Human Services. <i>SNAP Policy Manual, Appendix B: Table of Standards</i> (effective Oct. 1, 2026). <a href="https://www.nd.gov/dhs/policymanuals/SNAP/" target="_blank" rel="noopener">nd.gov</a></li>
        <li>U.S. Department of Agriculture, Economic Research Service. <i>Household Food Security in the United States in 2024.</i> <a href="https://www.ers.usda.gov/topics/food-nutrition-assistance/food-security-in-the-u-s" target="_blank" rel="noopener">ers.usda.gov</a></li>
        <li>Board of Governors of the Federal Reserve System. <i>Economic Well-Being of U.S. Households (SHED), 2025.</i> <a href="https://www.federalreserve.gov/consumerscommunities/shed.htm" target="_blank" rel="noopener">federalreserve.gov</a></li>
        <li>U.S. Department of Labor. <i>State Minimum Wage Laws</i> (North Dakota). <a href="https://www.dol.gov/agencies/whd/minimum-wage/state" target="_blank" rel="noopener">dol.gov</a></li>
      </ol>
      <div class="panel small">
        <p><b>Estimates:</b> car costs (${fmt(CONFIG.transport.carMonthly)}/mo), bus passes (Fargo ${fmt(CONFIG.cities.fargo.busPass)}, Minneapolis ${fmt(CONFIG.cities.minneapolis.busPass)}/mo), basics (${fmt(CONFIG.basicsMonthly)}/mo), Minneapolis home-based child care (${fmt(CONFIG.cities.minneapolis.childCare.home)}/mo), convenience-store markup (+${Math.round(CONFIG.food.convenienceMarkup * 100)}%), and credit card terms (${Math.round(CONFIG.surprise.cardAPR * 100)}% APR, ${fmt(CONFIG.surprise.cardMonthlyPayment)}/mo).</p>
        <p><b>SNAP:</b> estimated with the federal FY2027 formula. Gross pay minus a 20% earned-income deduction, the ${fmt(CONFIG.snap.standardDeduction)} standard deduction and the full child care cost, then an excess shelter deduction (rent above half of that income, capped at ${fmt(CONFIG.snap.excessShelterCap)}). Benefit = ${fmt(CONFIG.snap.max2Person)} − 30% of what's left. Eligibility ends above ${fmt(CONFIG.snap.grossLimit2Person)}/mo gross. Rent figures already include utilities, so no utility allowance is added.</p>
        <p><b>Meals:</b> cost per meal = monthly food cost ÷ (${CONFIG.daysInMonth} days × ${CONFIG.food.people} people × ${CONFIG.food.mealsPerDay} meals). Meals skipped = food shortfall ÷ cost per meal. Days covered = food budget ÷ monthly food cost × ${CONFIG.daysInMonth}.</p>
        <p style="margin:0"><b>Notes:</b> Take-home pay = gross minus 7.65% payroll tax. Annual tax credits (EITC, child tax credits) are paid once a year at tax time and are not included in monthly cash flow. Items marked "estimate" are approximations.</p>
      </div>
      <div class="actions"><button class="btn secondary" data-act="next" data-val="final">Back</button></div>`;
  }
};

/* ---------- Effects ---------- */
async function animateCalendar(r) {
  const cal = $("cal"); if (!cal) return;
  const cells = [...cal.children];
  const step = reduceMotion ? 0 : 45;
  for (let i = 0; i < cells.length; i++) {
    if (!document.body.contains(cal)) return;
    cells[i].classList.add(i < r.daysFed ? "on" : "off");
    if (i === r.daysFed && r.daysFed < cells.length) { cells[i].classList.add("last"); buzz(60); }
    if (step) await wait(i < r.daysFed ? step : step * 0.6);
  }
  const v = $("verdict");
  if (!v) return;
  if (r.foodGap > 0) v.innerHTML = t("food.verdictShort", { day: `<span class="red">day ${r.daysFed + 1}</span>` });
  else if (r.billsBehind > 0) v.innerHTML = t("food.verdictBills", { rent: `<span class="red">${t("food.verdictBillsRent")}</span>` });
  else v.innerHTML = t("food.verdictOk");
  v.classList.add("show");
  $("foodNext").style.opacity = 1;
}

function countUp() {
  document.querySelectorAll("[data-count]").forEach((el) => {
    const to = parseFloat(el.dataset.count), dec = +el.dataset.dec, dur = reduceMotion ? 0 : 1300, t0 = performance.now();
    const tick = (now) => {
      const k = dur ? Math.min(1, (now - t0) / dur) : 1;
      el.textContent = (to * (1 - Math.pow(1 - k, 3))).toFixed(dec) + "%";
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* ---------- Navigation ---------- */
function go(name) {
  S.screen = name;
  if (name === "basics") S.c.basics = true;
  if (name === "snap") S.c.snap = true;
  const m = $("screen");
  m.innerHTML = screens[name]();
  m.className = "";
  void m.offsetWidth;
  m.className = "enter";
  if (!EDITOR) window.scrollTo(0, 0);
  updateMeter();
  if (name === "surprise" && !S.c.surprise) setTimeout(() => { m.className = "shake"; buzz([80, 60, 80]); }, 450);
  if (EDITOR) EDITOR.syncJump();
}

function restart(cityKey, wageOverride) {
  S.city = cityKey; S.wageOverride = wageOverride ?? null; S.c = {};
  meterShown = 0;
  go(cityKey ? "housing" : "intro");
}

function cutNo(b, val) {
  const r = path();
  const msg = {
    rent: t("cut.rent.no", { gap: fmt(r.gap) }),
    care: t("cut.care.no", { pay: fmt(r.net), cost: fmt(r.care) }),
    transport: t("cut.transport.no", { pay: fmt(r.net), cost: fmt(r.transport) }),
    phone: t("cut.phone.no")
  }[val];
  b.classList.add("nope");
  b.disabled = true;
  let sub = b.querySelector(".opt-sub");
  if (!sub) { sub = document.createElement("div"); sub.className = "opt-sub"; b.appendChild(sub); }
  sub.innerHTML = msg;
  if (!b.querySelector(".tag")) b.insertAdjacentHTML("beforeend", `<span class="tag no">${t("cut.notOption")}</span>`);
  buzz(40);
}

let locked = false;
const AFTER = { housing: "care", care: "transport", transport: "basics", surprise: "surprise" };
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || locked || b.closest("#editor")) return;
  const { act, val } = b.dataset;
  if (act === "cut") {
    if (val !== "food") return cutNo(b, val);
    locked = true; b.classList.add("picked"); buzz(15); await wait(400); locked = false;
    S.c.cut = "food"; return go("cut");
  }
  if (act === "city" || AFTER[act]) {
    locked = true;
    b.classList.add("picked");
    b.parentElement.classList.add("locked");
    buzz(15);
    await wait(320);
    locked = false;
    if (act === "city") return restart(val);
    S.c[act] = val;
    return go(AFTER[act]);
  }
  switch (act) {
    case "next": go(val); break;
    case "raise": restart(S.city, parseFloat(val)); break;
    case "otherCity": restart(S.city === "fargo" ? "minneapolis" : "fargo"); break;
    case "replay": S.city = null; S.wageOverride = null; S.c = {}; meterShown = 0; go("intro"); break;
  }
});

/* =====================================================================
   EDIT PANEL — open the game with ?edit at the end of the URL
   ===================================================================== */
let EDITOR = null;
function startEditor() {
  const KEY = "build-a-budget-edits";
  const state = JSON.parse(JSON.stringify(EDITS));
  try { const d = JSON.parse(localStorage.getItem(KEY) || "null"); if (d) { Object.assign(state.config, d.config || {}); Object.assign(state.text, d.text || {}); } } catch (e) {}
  applyEdits(state);
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  // Collect editable fields
  const dataFields = [];
  (function walk(o, pre) {
    for (const k in o) {
      const v = o[k], p = pre ? pre + "." + k : k;
      if (v && typeof v === "object") walk(v, p);
      else if (typeof v === "number" || typeof v === "string") dataFields.push(p);
    }
  })(DEFAULTS.config, "");
  const textFields = Object.keys(DEFAULTS.text);

  const SCREENS = ["intro", "housing", "care", "transport", "basics", "snap", "surprise", "cut", "food", "results", "final", "sources"];
  const ed = document.createElement("aside");
  ed.id = "editor";
  ed.innerHTML = `<div class="ed-top">
      <h4>Edit panel</h4>
      <p>Changes show live in the game. They're saved in this browser until you download. When you're done: <b>Download</b>, then upload <b>index.html</b> to GitHub (Add file → Upload files → Commit).</p>
      <div class="ed-btns"><button class="pri" id="edDl">Download index.html</button><button id="edReset">Reset all</button></div>
      <select id="edJump" aria-label="Jump to screen">${SCREENS.map((s) => `<option value="${s}">Show screen: ${s}</option>`).join("")}</select>
      <div class="ed-tabs"><button data-tab="text" class="on">Words</button><button data-tab="data">Numbers &amp; data</button></div>
      <input id="edSearch" placeholder="Search…" style="margin-top:8px">
      <div class="ed-count" id="edCount" style="margin-top:6px"></div>
    </div><div class="ed-list" id="edList"></div>`;
  document.body.appendChild(ed);
  document.body.classList.add("editing");
  const tog = document.createElement("button");
  tog.id = "edToggle"; tog.textContent = "Edit";
  tog.onclick = () => ed.classList.toggle("open");
  document.body.appendChild(tog);

  let tab = "text";
  const curVal = (kind, p) => kind === "text" ? TEXT[p] : getPath(CONFIG, p);
  const defVal = (kind, p) => kind === "text" ? DEFAULTS.text[p] : getPath(DEFAULTS.config, p);
  const store = (kind) => kind === "text" ? state.text : state.config;
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

  function renderList() {
    const q = $("edSearch").value.trim().toLowerCase();
    const fields = tab === "text" ? textFields : dataFields;
    let html = "", group = null, shown = 0;
    for (const p of fields) {
      const v = curVal(tab, p);
      if (q && !(p.toLowerCase().includes(q) || String(v).toLowerCase().includes(q))) continue;
      const g = p.split(".")[tab === "data" && p.startsWith("cities.") ? 1 : 0];
      if (g !== group) { html += `<div class="ed-group">${g}</div>`; group = g; }
      const changed = p in store(tab);
      const isNum = typeof defVal(tab, p) === "number";
      const input = tab === "text" || (!isNum && String(v).length > 40)
        ? `<textarea rows="${Math.min(5, Math.ceil(String(v).length / 42) || 1)}">${esc(v)}</textarea>`
        : `<input ${isNum ? 'type="number" step="any"' : ""} value="${esc(v)}">`;
      html += `<label class="ed-f ${changed ? "changed" : ""}" data-p="${p}"><span class="ed-l"><i class="chg"></i>${p}<button type="button" class="rs">reset</button></span>${input}</label>`;
      shown++;
    }
    $("edList").innerHTML = html || `<p class="ed-count">No matches.</p>`;
    const n = Object.keys(state.text).length + Object.keys(state.config).length;
    $("edCount").textContent = `${shown} fields · ${n} changed`;
  }

  let timer = null;
  function rerender() {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const keep = meterShown;
      if (S.screen === "intro" || !S.city) go("intro"); else { go(S.screen); }
      meterShown = keep;
    }, 250);
  }

  $("edList").addEventListener("input", (e) => {
    const f = e.target.closest(".ed-f"); if (!f) return;
    const p = f.dataset.p, kind = tab;
    const isNum = typeof defVal(kind, p) === "number";
    let v = e.target.value;
    if (isNum) { if (v === "" || isNaN(+v)) return; v = +v; }
    if (kind === "text") TEXT[p] = v; else setPath(CONFIG, p, v);
    if (v === defVal(kind, p)) delete store(kind)[p]; else store(kind)[p] = v;
    f.classList.toggle("changed", p in store(kind));
    save(); rerender();
    const n = Object.keys(state.text).length + Object.keys(state.config).length;
    $("edCount").textContent = $("edCount").textContent.replace(/\d+ changed/, n + " changed");
  });
  $("edList").addEventListener("click", (e) => {
    const rs = e.target.closest(".rs"); if (!rs) return;
    e.preventDefault();
    const f = rs.closest(".ed-f"), p = f.dataset.p, kind = tab, d = defVal(kind, p);
    if (kind === "text") TEXT[p] = d; else setPath(CONFIG, p, d);
    delete store(kind)[p];
    save(); renderList(); rerender();
  });
  $("edSearch").addEventListener("input", renderList);
  ed.querySelectorAll(".ed-tabs button").forEach((b) => b.addEventListener("click", () => {
    tab = b.dataset.tab;
    ed.querySelectorAll(".ed-tabs button").forEach((x) => x.classList.toggle("on", x === b));
    renderList();
  }));
  $("edReset").addEventListener("click", () => {
    if (!confirm("Undo every change in the edit panel?")) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    state.config = {}; state.text = {};
    for (const p of dataFields) setPath(CONFIG, p, getPath(DEFAULTS.config, p));
    for (const p of textFields) TEXT[p] = DEFAULTS.text[p];
    renderList(); rerender();
  });
  $("edJump").addEventListener("change", (e) => jumpTo(e.target.value));
  $("edDl").addEventListener("click", () => downloadEdited(state));

  function jumpTo(name) {
    const order = ["housing", "care", "transport", "basics", "snap", "surprise", "cut", "food", "results", "final", "sources"];
    const idx = order.indexOf(name);
    if (idx < 0) { S.city = null; S.c = {}; meterShown = 0; return go("intro"); }
    if (!S.city) S.city = "fargo";
    const prev = S.c, c = {};
    const pick = (k, d) => (c[k] = prev[k] || d);
    if (idx > 0) pick("housing", "oneBR");
    if (idx > 1) pick("care", "home");
    if (idx > 2) pick("transport", "bus");
    if (idx > 3) c.basics = true;
    if (idx > 4) c.snap = true;
    if (idx > 5) pick("surprise", "pay");
    if (idx > 6) c.cut = "food";
    S.c = c;
    go(name);
  }

  renderList();
  EDITOR = { syncJump() { const j = $("edJump"); if (j && j.value !== S.screen && [...j.options].some((o) => o.value === S.screen)) j.value = S.screen; } };
}

async function downloadEdited(state) {
  const A = "/*EDITS" + "-START*/", B = "/*EDITS" + "-END*/";
  let src = null;
  try {
    const res = await fetch(location.href.split(/[?#]/)[0], { cache: "no-store" });
    if (res.ok) src = await res.text();
  } catch (e) {}
  if (!src || src.indexOf(A) < 0) {
    const doc = document.documentElement.cloneNode(true);
    ["#editor", "#edToggle"].forEach((s) => { const n = doc.querySelector(s); if (n) n.remove(); });
    const sc = doc.querySelector("#screen"); if (sc) sc.innerHTML = "";
    doc.querySelector("body").removeAttribute("class");
    src = "<!doctype html>\n" + doc.outerHTML;
  }
  const i = src.indexOf(A), j = src.indexOf(B, i);
  if (i < 0 || j < 0) { alert("Couldn't find the edits block in the file. Nothing was downloaded."); return; }
  const out = src.slice(0, i + A.length) + JSON.stringify(state, null, 2) + src.slice(j);
  const url = URL.createObjectURL(new Blob([out], { type: "text/html" }));
  const a = document.createElement("a");
  a.href = url; a.download = "index.html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

if (/[?&]edit(=|&|$)/.test(location.search)) startEditor();
go("intro");
</script>
