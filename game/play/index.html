    const debt = sim.card, behind = sim.behind;
    const first = computePath(S.city, { housing: S.c.housing, care: S.c.care, transport: S.c.transport });
    const conscious = (S.c.housing === "oneBR") + (S.c.care === "home") + (S.c.transport === "bus");

    // Headline
    let head;
    if (debt + behind > 1) head = sim.cash > 1
      ? t("yres.leadDebtCash", { amount: `<span class="red">${fmt(debt + behind)}</span>`, cash: fmt(sim.cash) })
      : t("yres.leadDebt", { amount: `<span class="red">${fmt(debt + behind)}</span>` });
    else if (meals > 0) head = t("yres.leadHungry");
    else head = t("yres.leadOk");

    // Tiles
    const tile = (big, label, cls) => `<div class="tile"><b class="${cls || ""}">${big}</b><span>${label}</span></div>`;
    const tiles = `<div class="tiles">
      ${tile(`${redMonths.length}<small>/12</small>`, t("yres.redMonths"), redMonths.length ? "red" : "accent")}
      ${tile(meals.toLocaleString("en-US"), t("yres.meals"), meals ? "red" : "accent")}
      ${tile(fmt(totalShort), t("yres.short"), totalShort > 0.5 ? "red" : "accent")}
      ${tile(fmt(debt), t("yres.card", { interest: fmt(sim.interestPaid) }), debt > 1 ? "red" : "accent")}
      ${tile(fmt(behind), t("yres.behind"), behind > 1 ? "red" : "accent")}
      ${tile(fmt(sim.cash), t("yres.cash"), "")}
    </div>`;

    // Year chart: cash above the line, debt below
    const mx = Math.max(1, ...ms.map((r) => Math.max(r.endCash, r.endCard + r.endBehind)));
    const chart = `<div class="ychart">${ms.map((r) => {
      const up = r.endCash / mx * 70, dn = (r.endCard + r.endBehind) / mx * 70;
      return `<div class="yc"><div class="yup"><i style="height:${up}px"></i></div><div class="ydn"><i style="height:${dn}px"></i></div><span>${MONTHS[r.m].slice(0, 1)}</span></div>`;
    }).join("")}</div>
    <div class="cal-key"><span><i style="background:var(--accent)"></i>${t("yres.chartCash")}</span><span><i style="background:var(--red)"></i>${t("yres.chartDebt")}</span></div>`;

    // Meals for the whole year: one row per month, one square per day
    const grid = `<div class="ygrid">${ms.map((r) => `<div class="yrow"><span>${MONTHS[r.m].slice(0, 3)}</span>${Array.from({ length: CONFIG.daysInMonth }, (_, d) => `<i class="${d < r.daysFed ? "" : "x"}"></i>`).join("")}</div>`).join("")}</div>
      <div class="cal-key"><span><i style="background:var(--accent)"></i>${t("food.keyOn")}</span><span><i style="background:var(--red)"></i>${t("food.keyOff")}</span></div>`;

    // Refund
    const rm = CONFIG.year.refundMonth;
    let runOut = null;
    for (let m = rm; m < ms.length; m++) if (ms[m].foodGap > 0.005 || ms[m].behindAdded > 0.5) { runOut = m; break; }
    const refundLine = t(runOut != null ? "yres.refundRanOut" : "yres.refundLasted", { amount: fmt(sim.refund.total), month: runOut != null ? MONTHS[runOut] : "" });

    // Emergencies
    const evs = ms.flatMap((r) => r.events.map((e) => ({ m: r.m, ...e })));
    const evList = evs.length
      ? `<ul class="auto">${evs.map((e) => `<li><span class="ico">${icon(EV_ICON[e.id])}</span>${MONTHS[e.m]}: ${t("ev." + e.id + ".short", null, true)} <small class="muted">&nbsp;(${e.how === "card" ? t("yres.onCard", null, true) : t("yres.fromSavings", null, true)})</small><span class="amt">${fmt(e.cost)}</span></li>`).join("")}</ul>`
      : `<p class="muted">${t("yres.noEvents")}</p>`;

    // Without SNAP, same year and choices
    const no = simulateYear(S.city, S.c, yearStart(), S.y.seed, S.y.choices, { wage: S.wageOverride, noSnap: true });
    const noSnap = `<div class="note plain">${t("yres.noSnap", { meals: no.mealsSkipped.toLocaleString("en-US"), debt: fmt(no.card + no.behind), snap: fmt(b.snap) })}</div>`;

    // 1,000 random years
    const mc = manyYears(S.city, S.c, yearStart(), { wage: S.wageOverride });
    const bar = (pct, label, cls) => `<div class="pbar"><div class="row"><span>${label}</span><b class="${cls}">${pct}%</b></div><div class="track"><i class="${cls}" data-w="${pct}"></i></div></div>`;
    const odds = `<div class="figure">
      ${bar(mc.pctDebt, t("yres.mcDebt"), mc.pctDebt > 0 ? "red" : "acc")}
      ${bar(mc.pctHungry, t("yres.mcHungry"), mc.pctHungry > 0 ? "red" : "acc")}
      <p class="cap small">${t("yres.mcMedian", { debt: fmt(mc.medianDebt), meals: mc.medianMeals })}</p>
      <p class="cite">${t("yres.mcNote", { n: mc.runs.toLocaleString("en-US") })}</p></div>`;

    // Same year, different help: replay this exact year (same emergencies) with one change
    const H = CONFIG.help, w0 = S.wageOverride ?? c.wage, w1 = w0 * (1 + H.trainingRaise);
    const copayAt = (w) => Math.round(takeHomeFor(w).gross * H.childCareCopayPct);
    // Every row uses the same rule for emergencies (savings if there's enough, otherwise the card), so rows compare fairly
    const run = (o) => simulateYear(S.city, S.c, yearStart(), S.y.seed, null, Object.assign({ wage: w0, policy: defaultPolicy }, o));
    const stat = (y) => ({ red: y.months.filter((x) => x.foodGap > 0.005 || x.behindAdded > 0.5).length, meals: y.mealsSkipped, debt: y.card + y.behind });
    const cmp = [
      [t("yres.cmpNone"), stat(run({})), "you"],
      [t("yres.cmpTrainingShort"), stat(run({ wage: w1 })), "", true],
      [t("yres.cmpMonthlyShort"), stat(run({ ctc2021: true })), ""],
      [t("yres.cmpCareShort"), stat(run({ careCost: copayAt(w0) })), "", true],
      [t("yres.cmpAll"), stat(run({ wage: w1, ctc2021: true, careCost: copayAt(w1) })), "all", true]
    ];
    // A raise can mean MORE skipped meals: it goes to rent you were behind on first, and SNAP shrinks as pay rises. Say so when it happens
    const more = cmp.slice(1).filter(([, x]) => x.meals > cmp[0][1].meals);
    const moreNote = more.length ? `<p class="cap small">${t(more.some((r) => r[3]) ? "yres.cmpMoreRaise" : "yres.cmpMore", { rows: more.map((r) => "“" + r[0] + "”").join(" and ") })}</p>` : "";
    const cell = (v, txt) => `<td class="n ${v > 0.5 ? "red" : "accent"}">${txt}</td>`;
    const cmpTable = `<div class="figure"><table class="cmp"><thead><tr><th></th><th class="n">${t("yres.cmpRed")}</th><th class="n">${t("yres.cmpMeals")}</th><th class="n">${t("yres.cmpDebt")}</th></tr></thead><tbody>
      ${cmp.map(([label, x, cls]) => `<tr class="${cls}"><th>${label}</th>${cell(x.red, x.red + "/12")}${cell(x.meals, x.meals.toLocaleString("en-US"))}${cell(x.debt, fmt(x.debt))}</tr>`).join("")}
      </tbody></table>${moreNote}<p class="cap small muted">${t("yres.cmpSub")}</p></div>`;
    const helpCard = (ico, title, how, howCite, real, realCite) => `<div class="helpcard"><div class="hc-top">${icon(ico)}<b>${title}</b></div>
      <p><span class="hc-k">${t("help.how", null, true)}</span>${how}${cite(howCite)}</p>
      <p class="real"><span class="hc-k">${t("help.real", null, true)}</span>${real}${cite(realCite)}</p></div>`;
    const helpCards = `<div class="helpcards">
      ${helpCard("dollar", t("yres.cmpTraining"), t("help.trainHow"), "Katz et al., 2020; MDRC", t("help.trainReal", { trained: H.trainedTotal.toLocaleString("en-US"), cashiers: (H.cashiersUS / 1e6).toFixed(1) + " million" }), "Year Up; Per Scholas; BLS, 2025")}
      ${helpCard("card", t("yres.cmpMonthly"), t("help.monthlyHow", { pct: H.ctcFoodDropPct }), "IRS; Shafer et al., 2022", t("help.monthlyReal"), "Bouchelle et al., 2022")}
      ${helpCard("kid", t("yres.cmpCare", { copay: fmt(copayAt(w0)) }), t("help.careHow"), "ACF, 2024", t("help.careReal", { pct: H.subsidyReceiptPct }), "HHS ASPE, 2022; Federal Register, 2026")}
    </div>`;
    const ctx = c.stateMinWageNote && !S.wageOverride ? `<p class="small muted">${t("results.context", { note: c.stateMinWageNote })}${cite("U.S. DOL")}</p>` : "";
    const raise = first.wageToClose ? `<button class="btn secondary" data-act="raise" data-val="${first.wageToClose}">${t("yres.raiseBtn", { wage: fmtWage(first.wageToClose) })}</button>` : "";
    const other = S.city === "fargo" ? "minneapolis" : "fargo";
    return `<p class="kicker">${t("results.choices3", { n: conscious })}</p>
      <p class="headline">${head}</p>
      ${tiles}
      ${S.wageOverride ? `<div class="note">${t("results.raise", { wage: fmtWage(S.wageOverride), diff: fmtWage(S.wageOverride - c.wage), oldWage: fmtWage(c.wage) })}</div>` : ""}
      <p class="section">${t("yres.whyTitle")}</p>
      ${(() => { const g = -(b.net - (b.housing + b.care + b.transport + b.basics) + b.snap - b.need);
        return g > 0.5 ? `<div class="note bad" style="font-size:16px">${t("yres.why", { gap: fmt(g) })}</div>`
          : `<div class="note" style="font-size:16px">${t("yres.whyThin", { spare: fmt(-g) })}</div>`; })()}
      <p class="section">${t("yres.yearTitle")}</p><div class="figure">${chart}</div>
      <div class="note">${refundLine}</div>
      <p class="section">${t("yres.mealsTitle")}</p><div class="figure">${grid}</div>
      <p class="section">${t("yres.eventsTitle")}</p>${evList}
      <p class="section">${t("results.snapTitle")}</p>${noSnap}
      <p class="section">${t("yres.mcTitle", { n: mc.runs.toLocaleString("en-US") })}</p>${odds}
      <p class="section">${t("yres.cmpTitle")}</p>${cmpTable}${helpCards}
      ${ctx}
      <p class="small muted">${t("yres.seed", { seed: S.y.seed })}</p>
      <div class="actions">
        ${next("final", t("results.next"), "go")}
        <button class="btn secondary" data-act="ynew">${t("yres.newYear")}</button>
        <button class="btn secondary" data-act="yreplay">${t("yres.sameYear")}</button>
        ${raise}
        <button class="btn secondary" data-act="otherCity">${t("results.otherCity", { city: CONFIG.cities[other].name.split(",")[0] })}</button>
        <button class="btn link" data-act="replay">${t("results.replay")}</button>
      </div>`;
  },

  final() {
    const st = CONFIG.stats;
    setTimeout(countUp, 200);
    setTimeout(() => {
      document.querySelectorAll(".picto.fill svg").forEach((el, i) => { if (i < Math.round(st.foodInsecure2024)) setTimeout(() => el.classList.add("red"), i * 70); });
    }, 300);
    return `<p class="kicker">${t("final.kicker")}</p>
      <div class="stat">
        <div class="big" data-count="${st.foodInsecure2024}" data-dec="1">0%</div>
        <p>${t("final.stat")}</p>
        <div class="figure">${picto(HOUSE, "0 0 12 14", 0, "").replace('class="picto"', 'class="picto fill"')}
        <p class="cap">${t("final.grid", { n: Math.round(st.foodInsecure2024) })}</p>${cite("USDA ERS, 2025")}</div>
      </div>
      <p class="closing">${t("final.closing")}</p>
      <div class="actions">
        <button class="btn secondary" data-act="next" data-val="sources">${t("final.sources")}</button>
        <button class="btn link" data-act="replay">${t("final.again")}</button>
      </div>
      <p class="credit">${t("final.credit")}</p>`;
  },

  sources() {
    return `
      <h2>Sources</h2>
      <ol class="sources">
        <li>U.S. Bureau of Labor Statistics. <i>Occupational Employment and Wage Statistics, May 2025: Cashiers (41-2011), Fargo, ND-MN.</i> <a href="https://www.bls.gov/oes/" target="_blank" rel="noopener">bls.gov/oes</a></li>
        <li>City of Minneapolis. <i>Minimum Wage, rate effective January 1, 2026.</i> <a href="https://www.minneapolismn.gov/" target="_blank" rel="noopener">minneapolismn.gov</a></li>
        <li>U.S. Department of Housing and Urban Development. <i>FY2026 Fair Market Rents</i> (Fargo, ND-MN MSA; Minneapolis-St. Paul-Bloomington, MN-WI MSA). <a href="https://www.huduser.gov/portal/datasets/fmr.html" target="_blank" rel="noopener">huduser.gov</a></li>
        <li>Child Care Aware of America. <i>2024 Affordability Analysis</i>, Tables I and II (full-time price, 4-year-old, center and family child care, by state). Statewide averages. <a href="https://info.childcareaware.org/hubfs/Affordability_Analysis_Updated_2024.pdf" target="_blank" rel="noopener">childcareaware.org</a></li>
        <li>U.S. Department of Agriculture, Food and Nutrition Service. <i>USDA Food Plans: Cost of Food Report (Thrifty Food Plan), January 2026.</i> <a href="https://www.fns.usda.gov/cnpp/usda-food-plans-cost-food-monthly-reports" target="_blank" rel="noopener">fns.usda.gov</a></li>
        <li>U.S. Department of Agriculture, Food and Nutrition Service. <i>SNAP Fiscal Year 2027 Cost-of-Living Adjustments.</i> <a href="https://www.fns.usda.gov/snap/allotment/cola" target="_blank" rel="noopener">fns.usda.gov</a></li>
        <li>North Dakota Department of Health and Human Services. <i>SNAP Policy Manual, Appendix B: Table of Standards</i> (effective Oct. 1, 2026). <a href="https://www.nd.gov/dhs/policymanuals/SNAP/" target="_blank" rel="noopener">nd.gov</a></li>
        <li>U.S. Department of Agriculture, Economic Research Service. <i>Household Food Security in the United States in 2024.</i> <a href="https://www.ers.usda.gov/topics/food-nutrition-assistance/food-security-in-the-u-s" target="_blank" rel="noopener">ers.usda.gov</a></li>
        <li>Board of Governors of the Federal Reserve System. <i>Economic Well-Being of U.S. Households (SHED), 2025.</i> <a href="https://www.federalreserve.gov/consumerscommunities/shed.htm" target="_blank" rel="noopener">federalreserve.gov</a></li>
        <li>Internal Revenue Service. Rev. Proc. 2025-25 (2026 applicable percentage table). <a href="https://www.irs.gov/pub/irs-drop/rp-25-25.pdf" target="_blank" rel="noopener">irs.gov</a>; HHS ASPE, Poverty Guidelines. <a href="https://aspe.hhs.gov/topics/poverty-economic-mobility/poverty-guidelines" target="_blank" rel="noopener">aspe.hhs.gov</a></li>
        <li>Minnesota Department of Human Services. <i>MinnesotaCare Premium Estimator Table, 2026</i> (DHS-4139A). <a href="https://edocs.dhs.state.mn.us/lfserver/Public/DHS-4139A-ENG" target="_blank" rel="noopener">edocs.dhs.state.mn.us</a>; North Dakota HHS, Medicaid eligibility. <a href="https://www.hhs.nd.gov/healthcare/medicaid/eligibility" target="_blank" rel="noopener">hhs.nd.gov</a></li>
        <li>Ullrich, Rebecca, and Aaron Sojourner. <i>Child Care Is Key to Our Economic Recovery: Technical Appendix</i>. CLASP, 2020 (NSECE prices by provider type). <a href="https://www.clasp.org/sites/default/files/AppendCCKeytoRecovCLASP.pdf" target="_blank" rel="noopener">clasp.org</a>; BLS CPI, Day care and preschool (CUUR0000SEEB03).</li>
        <li>U.S. Bureau of Labor Statistics. <i>Consumer Expenditure Surveys, 2025</i>, Table 1101: Quintiles of income before taxes. <a href="https://www.bls.gov/cex/tables/calendar-year/mean-item-share-average-standard-error/cu-income-quintiles-before-taxes-2025.xlsx" target="_blank" rel="noopener">bls.gov/cex</a></li>
        <li>Board of Governors of the Federal Reserve System. <i>Economic Well-Being of U.S. Households in 2025</i> (May 2026): unexpected expenses and savings. <a href="https://www.federalreserve.gov/publications/2026-economic-well-being-of-us-households-in-2025-economic-hardships.htm" target="_blank" rel="noopener">federalreserve.gov</a></li>
        <li>Internal Revenue Service. <i>Tax inflation adjustments for tax year 2025</i> (EITC, standard deduction, brackets); Child Tax Credit and dependent care credit rules for 2025. <a href="https://www.irs.gov/newsroom/irs-releases-tax-inflation-adjustments-for-tax-year-2025" target="_blank" rel="noopener">irs.gov</a></li>
        <li>Minnesota Department of Revenue. <i>Minnesota Child Tax Credit 2025</i>; 2025 standard deduction and income tax brackets. <a href="https://www.revenue.state.mn.us/child-tax-credit" target="_blank" rel="noopener">revenue.state.mn.us</a></li>
        <li>Katz, Lawrence F., et al. "Why Do Sectoral Employment Programs Work? Lessons from WorkAdvance." NBER Working Paper 28248. <a href="https://www.nber.org/system/files/working_papers/w28248/w28248.pdf" target="_blank" rel="noopener">nber.org</a>; MDRC on Project QUEST. <a href="https://mdrc.org/work/publications/meeting-needs-job-seekers-and-employers/file-full" target="_blank" rel="noopener">mdrc.org</a></li>
        <li>Year Up United (52,000+ students served) <a href="https://www.yearup.org/about" target="_blank" rel="noopener">yearup.org</a>; Per Scholas (35,000+ learners served) <a href="https://perscholas.org/" target="_blank" rel="noopener">perscholas.org</a>; BLS OEWS, cashiers employment, May 2025.</li>
        <li>Internal Revenue Service. "2021 Child Tax Credit and Advance Child Tax Credit Payments — Topic A: General Information." <a href="https://www.irs.gov/credits-deductions/2021-child-tax-credit-and-advance-child-tax-credit-payments-topic-a-general-information" target="_blank" rel="noopener">irs.gov</a></li>
        <li>Shafer, Paul R., et al. "Association of the Implementation of Child Tax Credit Advance Payments With Food Insufficiency." <i>JAMA Network Open</i>, 2022. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8759005" target="_blank" rel="noopener">pmc.ncbi.nlm.nih.gov</a>; Bouchelle, Zoe, et al. "Food Insufficiency Following Discontinuation of Monthly Child Tax Credit Payments." <i>JAMA Health Forum</i>, 2022. <a href="https://chibe.upenn.edu/publications/food-insufficiency-following-discontinuation-of-monthly-child-tax-credit-payments-among-lower-income-us-households" target="_blank" rel="noopener">chibe.upenn.edu</a></li>
        <li>HHS ASPE. <i>Child Care Subsidy Eligibility and Receipt</i>, 2019 (Sept. 2022). <a href="https://aspe.hhs.gov/sites/default/files/documents/1d276a590ac166214a5415bee430d5e9/cy2019-child-care-subsidy-eligibility.pdf" target="_blank" rel="noopener">aspe.hhs.gov</a>; ACF, <i>2024 CCDF Final Rule Fact Sheet</i>. <a href="https://acf.gov/sites/default/files/documents/occ/2024_CCDF_Final_Rule_Fact_Sheet.pdf" target="_blank" rel="noopener">acf.gov</a>; "Restoring Flexibility in the Child Care and Development Fund." <i>Federal Register</i>, 12 May 2026. <a href="https://www.federalregister.gov/documents/2026/05/12/2026-09382/restoring-flexibility-in-the-child-care-and-development-fund-ccdf" target="_blank" rel="noopener">federalregister.gov</a></li>
        <li>U.S. Department of Labor. <i>State Minimum Wage Laws</i> (North Dakota). <a href="https://www.dol.gov/agencies/whd/minimum-wage/state" target="_blank" rel="noopener">dol.gov</a></li>
      </ol>
      <div class="panel small">
        <p><b>Basic necessities:</b> ${fmt(CONFIG.basicsMonthly)}/mo is what the lowest-income fifth of U.S. households actually spent in 2025 on cell phone service (${fmt(CONFIG.basicsItems.phone)}/yr), clothes and shoes (${fmt(CONFIG.basicsItems.clothes)}), personal care (${fmt(CONFIG.basicsItems.personal)}) and housekeeping supplies (${fmt(CONFIG.basicsItems.supplies)}). Those households average 1.5 people, so this is on the low side for a parent and child. Furniture, appliances, health care and entertainment are left out; utilities are already in the rent figures.</p>
        <p><b>Health insurance (parent):</b> the child is covered at $0 (North Dakota CHIP; MinnesotaCare charges nothing for anyone under 21). Fargo: the parent earns too much for North Dakota Medicaid, so they buy a marketplace plan; with the premium tax credit they pay a set share of income for the benchmark silver plan (2026 IRS table; the larger pandemic-era credits ended after 2025). Minneapolis: MinnesotaCare, using the 2026 state premium table. Deductibles and copays are not modeled; big medical bills show up as emergencies.</p>
        <p><b>Child care from a neighbor or relative:</b> the median paid "unlisted" home provider charged $3.60/hr for a 4-year-old in 2012 (NSECE), raised to today's dollars with the BLS day care price index. Free family care is not modeled.</p>
        <p><b>Estimates:</b> car costs (${fmt(CONFIG.transport.carMonthly)}/mo), bus passes (Fargo ${fmt(CONFIG.cities.fargo.busPass)}, Minneapolis ${fmt(CONFIG.cities.minneapolis.busPass)}/mo), convenience-store markup (+${Math.round(CONFIG.food.convenienceMarkup * 100)}%), credit card terms, and refund timing (March).</p>
        <p><b>SNAP:</b> estimated with the federal FY2027 formula. Gross pay minus a 20% earned-income deduction, the ${fmt(CONFIG.snap.standardDeduction)} standard deduction and the full child care cost, then an excess shelter deduction (rent above half of that income, capped at ${fmt(CONFIG.snap.excessShelterCap)}). Benefit = ${fmt(CONFIG.snap.max2Person)} − 30% of what's left. Eligibility ends above ${fmt(CONFIG.snap.grossLimit2Person)}/mo gross. Rent figures already include utilities, so no utility allowance is added.</p>
        <p><b>A year:</b> every month repeats the same pay, rent, child care, transport, basic necessities, and SNAP. Emergencies are rolled at random each month so that each one happens with the yearly odds the Federal Reserve reports (car repair 30% per year, car owners only; home or appliance repair 22%; medical 21%; phone or computer 18%; legal bills, taxes, or fines 10%). Each cost is drawn from the survey's median cost range ($1,000–$1,999; $500–$999 for phones; $2,000–$4,999 for legal). Left out: child care cost increases (3%) and "other" (6%), because the survey gives no cost for them. The home or appliance rate is for all adults, including homeowners; renters may face it less often. The rolls come from a replay code (seed), not from how the player is doing.</p>
        <p><b>Each month:</b> pay the bills and the credit card's minimum payment first; bills the paycheck can't cover pile up as "behind". Then emergencies (savings or card). Then food: SNAP first, then cash. Whatever is missing is skipped meals. Unused SNAP stays on the EBT card. Leftover cash first catches up late bills.</p>
        <p><b>Tax refund (March):</b> 2025 federal rules for a head of household with one child: Earned Income Tax Credit, Child Tax Credit (refundable part up to $1,700), and the Child and Dependent Care Credit, minus federal income tax owed. Minneapolis also gets Minnesota's Child Tax Credit and Working Family Credit, minus Minnesota income tax. North Dakota has no state family credits; no ND income tax is owed at this income (North Dakota's 0% bracket covers head-of-household taxable income up to about $65,000). The EITC uses the formula rather than the IRS table, so it can differ by a few dollars.</p>
        <p><b>Credit card:</b> ${Math.round(CONFIG.card.apr * 100)}% APR; minimum payment is the larger of ${fmt(CONFIG.card.minPaymentFloor)} or interest plus 1% of the balance (estimates). No credit limit is modeled, which is generous to the player.</p>
        <p><b>1,000 years:</b> the same household replayed with 1,000 new random years and the same odds. In those runs, an emergency is paid from savings if that still leaves money for food, otherwise it goes on the card.</p>
        <p><b>Meals:</b> cost per meal = monthly food cost ÷ (${CONFIG.daysInMonth} days × ${CONFIG.food.people} people × ${CONFIG.food.mealsPerDay} meals). Meals skipped = food shortfall ÷ cost per meal. Days covered = food budget ÷ monthly food cost × ${CONFIG.daysInMonth}.</p>
        <p style="margin:0"><b>Notes:</b> Take-home pay = gross minus 7.65% payroll tax. Annual tax credits (EITC, child tax credits) are paid once a year at tax time and are not included in monthly cash flow. Items marked "estimate" are approximations.</p>
      </div>
      <div class="actions"><button class="btn secondary" data-act="next" data-val="final">Back</button></div>`;
  }
};

/* ---------- The year: helpers ---------- */
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const EV_ICON = { car: "wrench", medical: "med", phone: "phone", home: "home", legal: "card" };
function yearStart() { return startSavingsAmount(S.c.savings, S.city, S.c, S.wageOverride); }
function yearSim() { return simulateYear(S.city, S.c, yearStart(), S.y.seed, S.y.choices, { wage: S.wageOverride }); }
function seedFromUrl() { const m = location.search.match(/[?&]seed=(\d{1,9})/); return m ? +m[1] : null; }
function newYearState(seed) {
  return { seed: seed != null ? seed : 100000 + Math.floor(Math.random() * 900000), choices: {}, shown: -1, panel: null,
    auto: true, cutDone: false, cutPicked: false, seenBehind: false, seenRefund: false };
}
let yTimer = null;
function yStop() { clearTimeout(yTimer); yTimer = null; }
function yRender() {
  const m = $("screen");
  m.innerHTML = screens.year();
  updateMeter(); animateGraphics();
  if (EDITOR) EDITOR.after();
}
// Move the year forward one step: an emergency to decide, or the next month
function yAdvance() {
  yStop();
  const y = S.y, nextM = y.shown + 1;
  if (nextM >= CONFIG.year.months) return go("results");
  const sim = yearSim();
  if (sim.pending && sim.pending.m === nextM) {
    // The refund arrives at the start of the month, so show it before that month's emergency
    const part = sim.months[nextM];
    if (part && part.refund && !y.seenRefund) { y.seenRefund = true; y.panel = { type: "refundFirst", m: nextM }; yRender(); return; }
    y.panel = { type: "event", p: sim.pending }; yRender(); buzz([60, 40, 60]); return;
  }
  const r = sim.months[nextM];
  y.shown = nextM;
  if (r.refund && !y.seenRefund) { y.seenRefund = true; y.panel = { type: "refund" }; }
  else if (r.foodGap > 0.005 && !y.cutDone) { y.cutDone = true; y.cutGap = r.foodGap; y.panel = { type: "cut" }; }
  else if (r.behindAdded > 0.5 && !y.seenBehind) { y.seenBehind = true; y.panel = { type: "behind" }; }
  else y.panel = { type: "month" };
  yRender();
  if (y.panel.type === "month" && y.auto && nextM < CONFIG.year.months - 1) yTimer = setTimeout(yAdvance, reduceMotion ? 700 : 2000);
}
// red: food or bills fell short. amber: everything was paid, but only by spending money left from earlier months. green: money to spare
function monthChange(r) { return (r.endCash - r.endCard - r.endBehind) - (r.startCash - r.startCard - (r.startBehind || 0)); }
function monthState(r) { return r.foodGap > 0.005 || r.behindAdded > 0.5 ? "bad" : monthChange(r) < -0.5 ? "dip" : "ok"; }
// One month's money, line by line
function monthCard(r) {
  const b = yearSim().base;
  const ln = (label, amt, cls) => `<div class="ml ${cls || ""}"><span>${label}</span><b>${amt}</b></div>`;
  const change = monthChange(r), st = monthState(r);
  const short = r.foodGap > 0.005;
  return `<div class="mresult ${st === "bad" ? "neg" : st === "dip" ? "dip" : "pos"}"><span>${t("mc.result", null, true)}</span><b>${change < -0.5 ? "−" : "+"}${fmt(Math.abs(change))}</b></div>
  ${st === "dip" ? `<p class="small muted" style="margin:-4px 0 10px">${t("mc.dip", { cash: fmt(r.startCash) })}</p>` : ""}
  <div class="mfood ${short ? "short" : ""}">${icon("plate")}<div><b>${short ? t("mc.foodShort", { days: r.daysFed, n: r.mealsSkipped }, true) : t("mc.foodOk", null, true)}</b><span>${t("mc.food", { snap: fmt(r.snapUsed), cash: fmt(r.cashFood) }, true)}</span>${short ? `<span class="why">${t("mc.foodWhy", null, true)}</span>` : ""}</div></div>
  <div class="mcard">
    ${ln(t("mc.pay", null, true), "+" + fmt(b.net), "plus")}
    ${r.refund ? ln(t("mc.refund", null, true), "+" + fmt(r.refund), "plus") : ""}
    ${ln(t("mc.bills", null, true), "−" + fmt(b.housing + b.care + b.transport + b.basics))}
    ${r.cardPay > 0.5 ? ln(t("mc.cardPay", null, true), "−" + fmt(r.cardPay)) : ""}
    ${r.events.map((e) => ln(t("ev." + e.id + ".short", null, true) + (e.how === "card" ? ` <small>(${t("yres.onCard", null, true)})</small>` : ""), (e.how === "card" ? "" : "−") + fmt(e.cost), e.how === "card" ? "muted" : "")).join("")}
    ${r.behindPaid ? ln(t("mc.catchup", null, true), "−" + fmt(r.behindPaid)) : ""}
    ${r.behindAdded > 0.5 ? ln(`<span class="red">${t("mc.behind", null, true)}</span>`, `<span class="red">${fmt(r.behindAdded)}</span>`) : ""}
    ${ln(t("mc.end", null, true), fmt(r.endCash), "tot")}
  </div>`;
}
// An emergency arrives: pay from savings or put it on the card
function eventPanel(p) {
  const e = p.ev, ec = CONFIG.events.find((x) => x.id === e.id);
  const canSave = p.cash >= e.cost;
  const newBal = yearSim().card + e.cost;   // card balance right now, plus this bill
  const mp = cardMinPayment(newBal).pay;
  return `${notif(EV_ICON[e.id], "red", t("ev." + e.id + ".app"), t("ev." + e.id + ".title"), t("ev." + e.id + ".text", { cost: fmt(e.cost) }))}
    <div class="figure"><p class="cap">${t("ev.stat", { pct: Math.round(ec.annualChance * 100), what: t("ev." + e.id + ".short", null, true).toLowerCase() })}${cite("Federal Reserve, 2026")}</p></div>
    <div class="opts">
      ${(() => { const s = opt({ act: "yev", val: "savings", ico: "dollar", title: t("ev.savings"), price: fmt(e.cost), sub: canSave ? t("ev.savings.sub", { cash: fmt(p.cash) }) : t("ev.savings.no", { cash: fmt(p.cash) }), tag: canSave ? t("tag.noDebt") : "" }); return canSave ? s : s.replace('<button class="opt"', '<button class="opt nope" disabled'); })()}
      ${opt({ act: "yev", val: "card", ico: "card", title: t("ev.card"), price: fmt(e.cost), sub: t("ev.card.sub", { bal: fmt(newBal), pay: fmt(mp), apr: Math.round(CONFIG.card.apr * 100) + "%" }) + cite("estimate") })}
    </div>`;
}

/* ---------- Effects ---------- */
function countUp() {
  document.querySelectorAll("[data-count]").forEach((el) => {
    const to = parseFloat(el.dataset.count), dec = +el.dataset.dec, dur = reduceMotion ? 0 : 1300, t0 = performance.now();
    const tick = (now) => {
      const k = dur ? Math.min(1, (now - t0) / dur) : 1;
      el.textContent = (to * (1 - Math.pow(1 - k, 3))).toFixed(dec) + "%";
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* ---------- Navigation ---------- */
function go(name) {
  yStop();
  S.screen = name;
  if (name === "basics") S.c.basics = true;
  if (name === "snap") S.c.snap = true;
  const m = $("screen");
  m.innerHTML = screens[name]();
  m.className = "";
  void m.offsetWidth;
  m.className = "enter";
  if (!EDITOR) window.scrollTo(0, 0);
  updateMeter();
  animateGraphics();
  if (EDITOR) EDITOR.after();
}

function restart(cityKey, wageOverride) {
  S.city = cityKey; S.wageOverride = wageOverride ?? null; S.c = {}; S.y = null;
  meterShown = 0;
  go(cityKey ? "housing" : "intro");
}

function cutNo(b, val) {
  const r = path();
  const msg = {
    rent: t("cut.rent.no", { gap: fmt(S.y && S.y.cutGap != null ? S.y.cutGap : r.gap) }),
    care: t("cut.care.no", { pay: fmt(r.net), cost: fmt(r.care) }),
    transport: t("cut.transport.no", { pay: fmt(r.net), cost: fmt(r.transport) }),
    phone: t("cut.phone.no")
  }[val];
  b.classList.add("nope");
  b.disabled = true;
  let sub = b.querySelector(".opt-sub");
  if (!sub) { sub = document.createElement("div"); sub.className = "opt-sub"; b.appendChild(sub); }
  sub.innerHTML = msg;
  if (!b.querySelector(".tag")) b.insertAdjacentHTML("beforeend", `<span class="tag no">${t("cut.notOption")}</span>`);
  buzz(40);
}

let locked = false;
const AFTER = { housing: "care", care: "transport", transport: "basics", surprise: "surprise" };
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || locked || b.closest("#edbar,#ebPop,#ebSheet")) return;
  const { act, val } = b.dataset;
  if (act === "cut") {
    if (val !== "food") return cutNo(b, val);
    locked = true; b.classList.add("picked"); buzz(15); await wait(400); locked = false;
    S.y.cutPicked = true; return yRender();
  }
  if (act === "savings") {
    locked = true; buzz(15); await wait(200); locked = false;
    S.c.savings = "0"; S.y = newYearState(seedFromUrl()); meterShown = 0; return go("year");
  }
  if (act === "yev") {
    if (b.disabled) return;
    locked = true; b.classList.add("picked"); b.parentElement.classList.add("locked"); buzz(15); await wait(320); locked = false;
    const pp = S.y.panel.p; S.y.choices[pp.m + "-" + pp.i] = val; S.y.panel = null; return yAdvance();
  }
  if (act === "ystart" || act === "ycont") return yAdvance();
  if (act === "ypause") { S.y.auto = false; yStop(); return yRender(); }
  if (act === "yplay") { S.y.auto = true; return yAdvance(); }
  if (act === "ynew" || act === "yreplay") {
    S.y = newYearState(act === "yreplay" ? S.y.seed : null); meterShown = yearStart(); return go("year");
  }
  if (act === "city" || AFTER[act]) {
    locked = true;
    b.classList.add("picked");
    b.parentElement.classList.add("locked");
    buzz(15);
    await wait(320);
    locked = false;
    if (act === "city") return restart(val);
    S.c[act] = val;
    return go(AFTER[act]);
  }
  switch (act) {
    case "next": go(val); break;
    case "raise": restart(S.city, parseFloat(val)); break;
    case "otherCity": restart(S.city === "fargo" ? "minneapolis" : "fargo"); break;
    case "replay": S.city = null; S.wageOverride = null; S.c = {}; S.y = null; meterShown = 0; go("intro"); break;
  }
});

/* =====================================================================
   EDIT MODE — open the game with ?edit at the end of the URL.
   • Click any words to change them. Numbers and statistics are locked.
   • Highlight anything and tap "Ask Claude" to leave a note.
   • "Send to Claude" copies your notes + text changes to paste into chat.
   ===================================================================== */
let EDITOR = null;
const LOCKED_TEXT = ["final.stat", "final.grid", "intro.stubTax", "savings.context", "ev.stat", "help.trainHow", "help.trainReal", "help.monthlyHow", "help.monthlyReal", "help.careHow", "help.careReal"];   // statistics: never editable

function startEditor() {
  const KEY = "build-a-budget-edits-v2", NKEY = "build-a-budget-notes";
  const PUBLISHED = Object.assign({}, TEXT);   // text as currently published
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const phs = (s) => (String(s).match(/\{\w+\}/g) || []);

  // Drafts: { key: { value, base } }. A draft only applies while the published text still equals `base`,
  // so once Claude publishes a change (or changes that text differently), the old draft drops away.
  let drafts = {}, notes = [];
  try { drafts = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
  try { notes = JSON.parse(localStorage.getItem(NKEY) || "[]") || []; } catch (e) {}
  for (const k in drafts) {
    if (!(k in TEXT) || LOCKED_TEXT.includes(k) || PUBLISHED[k] !== drafts[k].base) { delete drafts[k]; continue; }
    TEXT[k] = drafts[k].value;
  }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(drafts)); localStorage.setItem(NKEY, JSON.stringify(notes)); } catch (e) {} };
  save();

  let editing = true;
  document.body.classList.add("editing", "editmode");

  // ---------- UI shell ----------
  const SCREENS = ["intro", "housing", "care", "transport", "basics", "snap", "year", "year-emergency", "results", "final", "sources"];
  const bar = document.createElement("div");
  bar.id = "edbar";
  bar.innerHTML = `<div class="eb-in">
      <div class="eb-row"><span class="eb-title">✎ Edit mode</span>
        <label class="eb-switch"><input type="checkbox" id="ebEdit" checked> Edit words</label>
        <select id="ebJump" aria-label="Jump to screen">${SCREENS.map((s) => `<option value="${s}">Screen: ${s}</option>`).join("")}</select></div>
      <div class="eb-row"><button id="ebAsk">Ask Claude</button><button id="ebNotes">Notes <span class="cnt" id="ebCount">0</span></button><button id="ebSend" class="pri">Send to Claude</button></div>
    </div>`;
  const chip = Object.assign(document.createElement("button"), { id: "ebChip", textContent: "Ask Claude about this", hidden: true });
  const pop = Object.assign(document.createElement("div"), { id: "ebPop", hidden: true });
  const sheet = Object.assign(document.createElement("div"), { id: "ebSheet", hidden: true });
  const toastEl = Object.assign(document.createElement("div"), { id: "ebToast", hidden: true });
  document.body.append(bar, chip, pop, sheet, toastEl);

  let toastT = null;
  const toast = (msg, ms = 2600) => { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (toastEl.hidden = true), ms); };
  const count = () => { $("ebCount").textContent = notes.length + Object.keys(drafts).length; };
  count();

  function rerender() {
    const y = window.scrollY;
    if (S.screen === "intro" || !S.city) go("intro"); else go(S.screen);
    requestAnimationFrame(() => window.scrollTo(0, y));
  }
  function markChanged() {
    document.querySelectorAll("#screen .tk").forEach((el) => {
      el.classList.toggle("tk-changed", el.dataset.tk in drafts);
      el.classList.toggle("tk-locked", LOCKED_TEXT.includes(el.dataset.tk));
    });
  }

  // ---------- Click words to edit ----------
  let activeEl = null;
  function closePop() { pop.hidden = true; if (activeEl) activeEl.classList.remove("tk-active"); activeEl = null; }
  function toEditable(raw) {
    return String(raw).split(/(\{\w+\})/).map((p) => /^\{\w+\}$/.test(p)
      ? `<span class="ph" contenteditable="false" data-ph="${p.slice(1, -1)}">🔒 ${p.slice(1, -1)}</span>` : esc(p)).join("");
  }
  function serialize(node) {
    let out = "";
    node.childNodes.forEach((n) => {
      if (n.nodeType === 3) out += n.nodeValue;
      else if (n.nodeType === 1) {
        if (n.dataset && n.dataset.ph) out += `{${n.dataset.ph}}`;
        else if (n.tagName === "BR") out += " ";
        else out += (/^(DIV|P)$/.test(n.tagName) ? " " : "") + serialize(n);
      }
    });
    return out;
  }
  function openEditor(el) {
    const key = el.dataset.tk;
    if (LOCKED_TEXT.includes(key)) { toast("Statistics are locked so the numbers stay accurate. Use Ask Claude if something looks off."); return; }
    closePop();
    activeEl = el; el.classList.add("tk-active");
    const raw = TEXT[key];
    pop.dataset.key = key;
    pop.innerHTML = `<div class="ep-head"><span>Edit text</span><button class="ep-x" data-ep="cancel" aria-label="Close">✕</button></div>
      <div class="ep-box" contenteditable="true" spellcheck="true">${toEditable(raw)}</div>
      <p class="ep-hint" id="epHint">${phs(PUBLISHED[key]).length ? "Gray 🔒 boxes are numbers from the data. They stay locked." : "Press Enter to save, Esc to cancel."} Put <b>**</b> around words to make them bold.</p>
      <div class="ep-btns">${key in drafts ? '<button data-ep="reset">Undo my change</button>' : ""}<button data-ep="cancel">Cancel</button><button class="pri" data-ep="save">Save</button></div>`;
    pop.hidden = false;
    const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
    let top = r.bottom + 8;
    if (top + ph > window.innerHeight - 130) top = Math.max(8, r.top - ph - 8);
    pop.style.top = top + "px";
    pop.style.left = Math.max(8, Math.min(window.innerWidth - pw - 8, r.left)) + "px";
    const box = pop.querySelector(".ep-box");
    box.focus();
    const range = document.createRange(); range.selectNodeContents(box); range.collapse(false);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  }
  function saveEdit() {
    const key = pop.dataset.key;
    const box = pop.querySelector(".ep-box");
    const val = serialize(box).replace(/ /g, " ").replace(/\s+/g, " ").trim();
    const need = phs(PUBLISHED[key]), have = phs(val);
    const missing = need.filter((p) => !have.includes(p));
    if (missing.length) { const h = $("epHint"); h.className = "ep-hint err"; h.textContent = `Put back the locked box: ${missing.join(", ")}. Cancel to start over.`; return; }
    if (!val) { const h = $("epHint"); h.className = "ep-hint err"; h.textContent = "This can't be empty."; return; }
    if (val === PUBLISHED[key]) delete drafts[key]; else drafts[key] = { value: val, base: PUBLISHED[key] };
    TEXT[key] = val;
    save(); count(); closePop(); rerender();
    toast("Saved on this device. Tap Send to Claude to publish it.");
  }
  pop.addEventListener("click", (e) => {
    const b = e.target.closest("[data-ep]"); if (!b) return;
    const a = b.dataset.ep;
    if (a === "cancel") closePop();
    if (a === "save") saveEdit();
    if (a === "reset") { const k = pop.dataset.key; TEXT[k] = PUBLISHED[k]; delete drafts[k]; save(); count(); closePop(); rerender(); }
  });
  pop.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveEdit(); }
    if (e.key === "Escape") closePop();
  });
  document.addEventListener("click", (e) => {
    if (e.target.closest("#edbar,#ebPop,#ebSheet,#ebChip,#ebToast")) return;
    if (!editing) return;
    const tk = e.target.closest(".tk");
    if (!tk) { if (!pop.hidden) closePop(); return; }
    if (window.getSelection().toString().trim()) return;   // they're highlighting, not editing
    e.preventDefault(); e.stopPropagation();
    openEditor(tk);
  }, true);

  // ---------- Highlight + Ask Claude ----------
  let lastSel = null;
  document.addEventListener("selectionchange", () => {
    const sel = window.getSelection();
    const txt = sel ? sel.toString().trim() : "";
    if (!txt || !sel.rangeCount || !$("screen").contains(sel.anchorNode) || !pop.hidden) { chip.hidden = true; return; }
    const r = sel.getRangeAt(0).getBoundingClientRect();
    const keys = [...$("screen").querySelectorAll(".tk")].filter((el) => sel.containsNode(el, true)).map((el) => el.dataset.tk);
    const anc = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
    const own = anc && anc.closest(".tk");
    if (own && !keys.includes(own.dataset.tk)) keys.unshift(own.dataset.tk);
    lastSel = { text: txt.slice(0, 400), keys: [...new Set(keys)].slice(0, 6) };
    chip.hidden = false;
    chip.style.top = Math.min(window.innerHeight - 190, r.bottom + 10) + "px";
    chip.style.left = Math.max(8, Math.min(window.innerWidth - chip.offsetWidth - 8, r.left + r.width / 2 - chip.offsetWidth / 2)) + "px";
  });
  const keepSel = (e) => e.preventDefault();
  chip.addEventListener("mousedown", keepSel);
  $("ebAsk").addEventListener("mousedown", keepSel);
  chip.addEventListener("click", () => openAsk(lastSel));
  $("ebAsk").addEventListener("click", () => {
    const sel = window.getSelection();
    openAsk(sel && sel.toString().trim() && $("screen").contains(sel.anchorNode) ? lastSel : null);
  });

  function closeSheet() { sheet.hidden = true; sheet.innerHTML = ""; }
  sheet.addEventListener("click", (e) => { if (e.target === sheet) closeSheet(); });
  const where = () => `${S.screen}${S.city ? " · " + CONFIG.cities[S.city].name : ""}`;

  function openAsk(selInfo) {
    chip.hidden = true;
    sheet.innerHTML = `<div class="sh-card"><h4>Ask Claude</h4>
      <p class="sh-sub">Your note is saved on this device. Send all your notes to Claude at once when you're ready.</p>
      ${selInfo ? `<div class="sh-quote">“${esc(selInfo.text)}”</div>` : `<div class="sh-quote">About the whole <b>${esc(S.screen)}</b> screen</div>`}
      <div class="sh-meta">Screen: ${esc(where())}</div>
      <textarea id="shNote" placeholder="What should change? For example: make this shorter, try a different picture, this sounds preachy, is this number right?"></textarea>
      <div class="ep-btns"><button data-sh="close">Cancel</button><button class="pri" data-sh="add">Add note</button></div></div>`;
    sheet.hidden = false;
    setTimeout(() => $("shNote").focus(), 50);
    sheet.querySelector('[data-sh="close"]').onclick = closeSheet;
    sheet.querySelector('[data-sh="add"]').onclick = () => {
      const note = $("shNote").value.trim();
      if (!note) { $("shNote").focus(); return; }
      notes.push({ screen: S.screen, city: S.city ? CONFIG.cities[S.city].name : "", quote: selInfo ? selInfo.text : "", keys: selInfo ? selInfo.keys : [], note, at: new Date().toISOString() });
      save(); count(); closeSheet();
      try { window.getSelection().removeAllRanges(); } catch (e) {}
      toast("Note added. Tap Send to Claude when you're ready.");
    };
  }

  function openNotes() {
    const dk = Object.keys(drafts);
    sheet.innerHTML = `<div class="sh-card"><h4>Your notes and changes</h4>
      <p class="sh-sub">Saved on this device until Claude publishes them.</p>
      <div class="sh-h">Notes for Claude (${notes.length})</div>
      ${notes.length ? notes.map((n, i) => `<div class="sh-item"><button class="del" data-del-note="${i}" aria-label="Delete">×</button>
        <div class="sh-meta">${esc(n.screen)}${n.city ? " · " + esc(n.city) : ""}</div>
        ${n.quote ? `<div class="sh-quote">“${esc(n.quote)}”</div>` : ""}${esc(n.note)}</div>`).join("") : `<p class="sh-empty">No notes yet. Highlight something in the game, then tap Ask Claude.</p>`}
      <div class="sh-h">Text changes (${dk.length})</div>
      ${dk.length ? dk.map((k) => `<div class="sh-item"><button class="del" data-del-edit="${esc(k)}" aria-label="Undo">×</button>
        <div class="sh-meta">${esc(k)}</div><s class="muted">${esc(drafts[k].base)}</s><br>${esc(drafts[k].value)}</div>`).join("") : `<p class="sh-empty">No text changes yet. Click any words in the game to edit them.</p>`}
      <div class="ep-btns" style="margin-top:12px"><button data-sh="close">Close</button><button class="pri" data-sh="send">Send to Claude</button></div></div>`;
    sheet.hidden = false;
    sheet.querySelector('[data-sh="close"]').onclick = closeSheet;
    sheet.querySelector('[data-sh="send"]').onclick = sendToClaude;
    sheet.querySelectorAll("[data-del-note]").forEach((b) => b.onclick = () => { notes.splice(+b.dataset.delNote, 1); save(); count(); openNotes(); });
    sheet.querySelectorAll("[data-del-edit]").forEach((b) => b.onclick = () => { const k = b.dataset.delEdit; TEXT[k] = PUBLISHED[k]; delete drafts[k]; save(); count(); rerender(); openNotes(); });
  }

  function bundle() {
    const dk = Object.keys(drafts);
    const lines = ["Build a Budget: notes from edit mode", location.href.split(/[?#]/)[0], ""];
    lines.push(`NOTES (${notes.length})`);
    notes.forEach((n, i) => {
      lines.push(`${i + 1}. Screen: ${n.screen}${n.city ? " (" + n.city + ")" : ""}`);
      if (n.quote) lines.push(`   Highlighted: "${n.quote}"`);
      if (n.keys && n.keys.length) lines.push(`   Text keys: ${n.keys.join(", ")}`);
      lines.push(`   Note: ${n.note}`);
    });
    lines.push("", `TEXT CHANGES (${dk.length})`);
    dk.forEach((k) => { lines.push(`- ${k}`, `  was: ${JSON.stringify(drafts[k].base)}`, `  now: ${JSON.stringify(drafts[k].value)}`); });
    return lines.join("\n");
  }
  async function sendToClaude() {
    if (!notes.length && !Object.keys(drafts).length) { toast("Nothing to send yet. Add a note or edit some words first."); return; }
    const text = bundle();
    let copied = false;
    try { await navigator.clipboard.writeText(text); copied = true; } catch (e) {}
    sheet.innerHTML = `<div class="sh-card"><h4>${copied ? "Copied!" : "Copy this"}</h4>
      <p class="sh-sub">${copied ? "Paste it into your chat with Claude (Ctrl+V). Claude will make the changes and publish them." : "Select all the text below, copy it, and paste it into your chat with Claude."}</p>
      <textarea readonly style="min-height:200px;font:12.5px/1.45 var(--mono)">${esc(text)}</textarea>
      <div class="ep-btns"><button data-sh="clear">Clear my notes</button><button class="pri" data-sh="close">Done</button></div></div>`;
    sheet.hidden = false;
    const ta = sheet.querySelector("textarea"); if (!copied) { ta.focus(); ta.select(); }
    sheet.querySelector('[data-sh="close"]').onclick = closeSheet;
    sheet.querySelector('[data-sh="clear"]').onclick = () => {
      if (!confirm("Clear your notes? (Text changes stay until Claude publishes them.)")) return;
      notes = []; save(); count(); closeSheet(); toast("Notes cleared.");
    };
  }
  $("ebNotes").addEventListener("click", openNotes);
  $("ebSend").addEventListener("click", sendToClaude);

  // ---------- Bar controls ----------
  $("ebEdit").addEventListener("change", (e) => {
    editing = e.target.checked;
    document.body.classList.toggle("editmode", editing);
    closePop();
    toast(editing ? "Click any words to edit them." : "Editing paused. Play the game normally.");
  });
  $("ebJump").addEventListener("change", (e) => jumpTo(e.target.value));

  function jumpTo(name) {
    const order = ["housing", "care", "transport", "basics", "snap", "year", "year-emergency", "results", "final", "sources"];
    const idx = order.indexOf(name);
    closePop();
    if (idx < 0) { S.city = null; S.c = {}; S.y = null; meterShown = 0; return go("intro"); }
    if (!S.city) S.city = "fargo";
    const prev = S.c, c = {};
    const pick = (k, d) => (c[k] = prev[k] || d);
    if (idx > 0) pick("housing", "oneBR");
    if (idx > 1) pick("care", "home");
    if (idx > 2) pick("transport", "car");
    if (idx > 3) c.basics = true;
    if (idx > 4) c.snap = true;
    if (idx > 4) c.savings = "0";
    S.c = c;
    if (idx >= 5 && idx <= 7) {
      S.y = newYearState(S.y ? S.y.seed : 123457);
      if (name === "year") return go("year");
      if (name === "year-emergency") {            // play forward to the first emergency
        S.screen = "year"; S.y.auto = false;
        for (let k = 0; k < 13; k++) { yAdvance(); if (S.y.panel && S.y.panel.type === "event") break; if (S.screen !== "year") break; }
        return;
      }
      // results: let the default rule make every emergency choice
      for (let k = 0; k < 40; k++) { const sim = yearSim(); if (!sim.pending) break; const pp = sim.pending; S.y.choices[pp.m + "-" + pp.i] = defaultPolicy(pp.ev, { cash: pp.cash, foodCashNeeded: 0 }); }
      S.y.shown = CONFIG.year.months - 1;
      return go("results");
    }
    go(name);
    window.scrollTo(0, 0);
  }

  EDITOR = {
    after() {
      const j = $("ebJump");
      if (j && [...j.options].some((o) => o.value === S.screen)) j.value = S.screen;
      markChanged();
      chip.hidden = true;
    }
  };
  setTimeout(() => toast("Edit mode: click any words to change them. Highlight anything to ask Claude.", 4200), 400);
}

if (EDIT_MODE) startEditor();
go("intro");
</script>
</body>
</html>
