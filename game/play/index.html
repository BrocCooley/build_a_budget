<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe6">
<title>Build a Budget</title>
<meta name="description" content="A two-minute budgeting game about food insecurity: one cashier's paycheck, thirty days, and what's left for food.">
<style>
:root{
  --bg:#f3efe6; --card:#fffdf8; --paper:#fffef9; --ink:#17201c; --muted:#5f665f; --faint:#8b918a; --line:#e3ddd0;
  --accent:#1d6b52; --accent-ink:#ffffff; --accent-soft:#dcebe3; --accent-deep:#124a38;
  --red:#c0331f; --red-soft:#f6ddd7; --amber:#b7791f;
  --s1:#17201c; --s2:#3d4641; --s3:#646c67; --s4:#8d938e; --s5:#b6bab4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Charter,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}

/* ---------- Meter ---------- */
.meter{position:sticky;top:0;z-index:10;background:rgba(243,239,230,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 16px 10px;border-bottom:1px solid var(--line);transition:transform .4s var(--ease)}
.meter.idle{transform:translateY(-100%);position:absolute;left:0;right:0;pointer-events:none}
.meter-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.meter-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.day{font:700 11px/1 var(--mono);letter-spacing:.06em;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 9px;white-space:nowrap}
.meter-main{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px;margin-top:3px;min-height:38px}
.meter-amt{font:700 32px/1.1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:color .3s}
.meter-amt.neg{color:var(--red)}
.meter-amt.bump{animation:bump .45s var(--ease)}
@keyframes bump{30%{transform:scale(1.06)}}
.ebt{font:700 12px/1 var(--mono);color:var(--accent-deep);background:var(--accent-soft);border-radius:6px;padding:5px 7px;align-self:center;animation:pop .5s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.meter-delta{margin-left:auto;font:700 14px/1 var(--mono);font-variant-numeric:tabular-nums;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.meter-delta.show{opacity:1;transform:none}
.meter-delta.down{color:var(--red)}
.meter-delta.up{color:var(--accent)}
.meter-bar{height:5px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.meter-fill{height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .8s var(--ease),background .3s}
.meter-fill.low{background:var(--red)}

/* ---------- Layout ---------- */
main{flex:1;padding:20px 16px 36px}
main.enter{animation:enter .45s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
main.shake{animation:shake .5s ease}
@keyframes shake{15%,55%{transform:translateX(-7px)}35%,75%{transform:translateX(7px)}}
.dots{display:flex;gap:5px;margin:0 0 18px}
.dots i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.dots i.done{background:var(--ink)}
.dots i.now{background:var(--accent)}
.kicker{font:700 11px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h1,h2{font-family:var(--serif);font-weight:700;letter-spacing:-.015em;margin:0}
h1{font-size:44px;line-height:1.02;margin-bottom:16px}
h2{font-size:30px;line-height:1.08;margin-bottom:10px}
p{margin:0 0 14px}
.lead{font-size:17px}
.muted{color:var(--muted)}
.cite{display:block;font-size:11.5px;color:var(--faint);margin-top:3px;font-weight:400}
.small{font-size:14px}
.red{color:var(--red)}
.accent{color:var(--accent)}
.section{margin:26px 0 8px;font:700 11px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- Choice cards ---------- */
.opts{margin-top:18px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:15px 16px 14px;margin:0 0 12px;cursor:pointer;min-height:72px;position:relative;transition:border-color .15s,transform .15s var(--ease),box-shadow .2s,opacity .25s,background .2s;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.opt:hover{border-color:var(--ink);box-shadow:0 6px 18px -10px rgba(0,0,0,.25)}
.opt:active{transform:scale(.98)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.015)}
.opts.locked .opt:not(.picked){opacity:.35}
.opt.nope{border-color:var(--red);background:var(--red-soft);cursor:default;animation:shake .45s ease}
.opt.nope:hover{box-shadow:none}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt-top{display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px}
.opt-top .t{flex:1}
.opt-ico{width:38px;height:38px;border-radius:11px;background:var(--bg);display:grid;place-items:center;flex:none;color:var(--ink)}
.opt.nope .opt-ico{background:#fff;color:var(--red)}
.opt-price{font:700 16px/1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.opt-sub{font-size:14px;color:var(--muted);margin-top:6px}
.opt.nope .opt-sub{color:var(--red);font-weight:600}
/* Rich choice cards: illustration | text | price + mini chart */
.rich-row{display:flex;align-items:center;gap:14px}
.rich-row .art{flex:none;width:84px;height:62px;display:grid;place-items:center;background:var(--bg);border-radius:12px}
.rich-row .mid{flex:1;min-width:0}
.rich-row .t{font-weight:700;font-size:17px}
.rich-row .mid .opt-sub{margin-top:3px}
.rich-row .side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.opt .extra{margin-top:12px}

/* Pay stub (intro) */
.stub{margin-top:10px;background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(0,0,0,.03) 22px 23px),var(--paper);border:1px dashed #cfc7b6;border-radius:10px;padding:8px 11px;font:12.5px/1.5 var(--mono)}
.stub div{display:flex;justify-content:space-between;gap:8px}
.stub .tot{border-top:1px solid var(--ink);margin-top:4px;padding-top:4px;font-weight:800;font-size:14px}
.stub .minus{color:var(--red)}

/* Floor plans (housing) */
.plan{width:78px;height:56px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.plan .bed{fill:var(--accent-soft);stroke:var(--accent)}
.plan .pillow{fill:#fff;stroke:var(--accent);stroke-width:1}
.plan .furn{fill:#e9e4d8;stroke:var(--s4);stroke-width:1.2}
.plan text{font:700 6px var(--mono);fill:var(--muted);stroke:none}

/* Donut (share of paycheck) */
.donut{width:46px;height:46px}
.donut .bg{fill:none;stroke:var(--line);stroke-width:6}
.donut .fg{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:butt;transition:stroke-dasharray 1s var(--ease)}
.donut text{font:800 10px var(--mono);fill:var(--ink)}
.donut .sub{font:600 5px var(--mono);fill:var(--muted)}

/* Shift blocks (child care, results) */
.shifts{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.shifts i{height:20px;border-radius:5px;border:1.5px solid var(--line);background-color:var(--card)}
.shifts i.extra{border:1.5px dashed var(--red)}
.shift-cap{font-size:13px;color:var(--muted);margin-top:7px}

/* Route maps (transport) */
.route{width:78px;height:56px;fill:none;stroke-linecap:round;stroke-linejoin:round}
.route .road{stroke:var(--s4);stroke-width:5}
.route .lane{stroke:#fff;stroke-width:1.2;stroke-dasharray:3 3}
.route .line{stroke:var(--accent);stroke-width:2.2;stroke-dasharray:1 5}
.route .stop{fill:#fff;stroke:var(--accent);stroke-width:1.8}
.route .pin{fill:var(--ink);stroke:none}
.route .store{fill:var(--red);stroke:none}
.route text{font:700 6px var(--mono);fill:var(--muted);stroke:none}
.ptags{display:flex;align-items:center;gap:6px}
.ptag{position:relative;flex:1;display:inline-flex;align-items:center;justify-content:space-between;gap:5px;padding:7px 8px 7px 16px;font:600 11px/1 var(--mono);white-space:nowrap;background:var(--card);border:1.5px solid var(--ink);clip-path:polygon(9px 0,100% 0,100% 100%,9px 100%,0 50%)}
.ptag::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink);position:absolute;left:7px}
.ptag.red{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.ptag.red::before{background:var(--red)}
.ptags .ar{font:700 16px/1 var(--mono);color:var(--muted)}

/* Pictograms (surprise: people, final: houses) */
.picto{display:grid;grid-template-columns:repeat(20,1fr);gap:3px 4px;margin:6px 0 10px;max-width:360px}
.picto svg{width:100%;height:auto;fill:var(--line);transition:fill .3s}
.picto svg.on{fill:var(--accent)}
.picto svg.red{fill:var(--red)}

/* Grocery bag (food) */
.bagwrap{display:flex;align-items:center;gap:18px}
.bag{width:118px;height:130px;flex:none;overflow:visible}
.bag .outline{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.bag .handle{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.bag .empty{fill:var(--red-soft)}
.bag .fill{fill:var(--accent);transform-box:view-box;transform-origin:50% 106px;transform:scaleY(0);transition:transform 1.4s var(--ease)}
.bag .need{stroke:var(--red);stroke-width:1.5;stroke-dasharray:3 3}
.bag text{font:700 8px var(--mono);fill:var(--red)}
.bagtxt .pc{font:800 44px/1 var(--mono);letter-spacing:-.03em}
.bagtxt .lb{font-size:14px;color:var(--muted);margin:2px 0 10px}
.bagtxt .ln{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0;border-top:1px dashed var(--line)}
.bagtxt .ln b{font-family:var(--mono)}

/* SNAP number line (results) */
.nline{position:relative;height:118px;margin:4px 6px 0}
.nl-track{position:absolute;left:0;right:0;top:58px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--red-soft),var(--line) 70%,var(--accent-soft))}
.nl-zero{position:absolute;top:44px;height:32px;border-left:2px solid var(--ink)}
.nl-zero > span{position:absolute;top:-16px;left:-30px;width:60px;text-align:center;font:700 10px/1.2 var(--mono);color:var(--ink)}
.nl-arrow{position:absolute;top:57px;height:6px;background:var(--accent);border-radius:3px;transition:width 1.1s var(--ease)}
.nl-arrow::after{content:"";position:absolute;right:-7px;top:-4px;border:7px solid transparent;border-left:9px solid var(--accent);border-right:0}
.nl-dot{position:absolute;top:52px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--ink)}
.nl-dot.red{background:var(--red)}
.nl-dot.acc{background:var(--accent)}
.nl-dot > span{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font:600 11px/1.25 var(--mono);text-align:center}
.nl-dot.red > span{bottom:24px;color:var(--red)}
.nl-dot.acc > span{top:24px;color:var(--accent-deep)}
.nl-dot.edgeL > span{left:-6px;transform:none;text-align:left}
.nl-dot.edgeR > span{left:auto;right:-6px;transform:none;text-align:right}
.tag{display:inline-block;font:700 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent-deep);margin-top:9px}
.tag.no{background:var(--red);color:#fff}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:17px 16px;border-radius:16px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:17px;cursor:pointer;margin:0 0 10px;transition:transform .12s,background .2s}
.btn:hover{background:#000}
.btn:active{transform:scale(.98)}
.btn.go{background:var(--accent)}
.btn.go:hover{background:var(--accent-deep)}
.btn.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.secondary:hover{background:var(--card)}
.btn.link{background:none;color:var(--muted);padding:12px;font-size:15px;font-weight:600}
.btn .arr{transition:transform .2s}
.btn:hover .arr{transform:translateX(3px)}
.actions{margin-top:24px}

.note{background:var(--accent-soft);border-radius:14px;padding:13px 15px;font-size:15px;margin:0 0 14px}
.note.bad{background:var(--red-soft)}
.note.plain{background:var(--card);border:1px solid var(--line)}

/* ---------- Intro ---------- */
.hero{padding-top:12px}
.hero h1 > span{display:block;animation:rise .7s var(--ease) both}
.hero h1 > span:nth-child(2){animation-delay:.15s}
.hero h1 > span:nth-child(3){animation-delay:.3s;color:var(--accent)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.who{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 22px}
.who > span{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--sans);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 11px 7px 8px}
.who svg.i{width:17px;height:17px}

/* ---------- Phone notification ---------- */
.notif{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:20px;padding:13px 14px;box-shadow:0 14px 34px -16px rgba(0,0,0,.35);margin:4px 0 20px;animation:drop .65s cubic-bezier(.2,1.3,.35,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.96)}}
.notif-icon{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--ink)}
.notif-icon.red{background:var(--red)}
.notif-icon.green{background:var(--accent)}
.notif-body{flex:1;min-width:0}
.notif-head{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600}
.notif-title{font-weight:700;font-size:15.5px;margin-top:2px}
.notif-text{font-size:14.5px;color:var(--ink)}

/* ---------- Autopay ---------- */
.auto{list-style:none;padding:0;margin:16px 0}
.auto li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);animation:rise .5s var(--ease) both}
.auto li:nth-child(2){animation-delay:.12s}.auto li:nth-child(3){animation-delay:.24s}.auto li:nth-child(4){animation-delay:.36s}
.auto .ico{width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.auto .tot{border-bottom:0;font-weight:700}
.auto .amt{margin-left:auto;font-family:var(--mono);font-weight:700}

/* ---------- EBT card ---------- */
.ebtcard{position:relative;aspect-ratio:1.6;max-width:300px;border-radius:18px;padding:18px 20px;color:#fff;background:linear-gradient(135deg,#25805f 0%,#1d6b52 45%,#124a38 100%);box-shadow:0 18px 36px -18px rgba(18,74,56,.7);margin:6px 0 20px;overflow:hidden;animation:cardin .8s cubic-bezier(.2,1.2,.35,1) both}
@keyframes cardin{from{opacity:0;transform:rotate(-6deg) translateY(30px) scale(.9)}}
.ebtcard::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.ebtcard .chip{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#e9d9a6,#c7b06b);margin:14px 0 10px}
.ebtcard .lbl{font:700 12px/1 var(--mono);letter-spacing:.14em;opacity:.85}
.ebtcard .bal{font:800 34px/1 var(--mono);letter-spacing:-.02em}
.ebtcard .foot{position:absolute;left:20px;bottom:16px;font:600 11px/1 var(--mono);letter-spacing:.1em;opacity:.8}

/* ---------- Dot / meal grids ---------- */
.g100{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin:12px 0 8px;max-width:340px}
.g100 i{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--s5);transition:background .3s,border-color .3s}
.g100 i.on{background:var(--accent);border-color:var(--accent)}
.g100 i.red{background:var(--red);border-color:var(--red)}
.figure{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:0 0 14px}
.figure .cap{font-size:14px;color:var(--ink);margin:0}

.meals{display:grid;grid-template-columns:repeat(30,1fr);grid-template-rows:repeat(6,auto);grid-auto-flow:column;gap:2px;margin:10px 0 6px}
.meals i{aspect-ratio:1;border-radius:2px;background:var(--accent);transition:background .2s}
.meals i.x{background:var(--red)}
.meals-key{display:flex;justify-content:space-between;font:600 11px/1.3 var(--mono);color:var(--muted)}

/* ---------- Bars ---------- */
.hbar{margin:10px 0}
.hbar .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.hbar .row b{font-family:var(--mono)}
.hbar .track{height:14px;background:var(--bg);border-radius:7px;overflow:hidden}
.hbar .track i{display:block;height:100%;width:0;border-radius:7px;background:var(--ink);transition:width 1s var(--ease)}
.hbar .track i.acc{background:var(--accent)}
.hbar .track i.red{background:var(--red)}

.stack{position:relative;display:flex;height:34px;border-radius:9px;overflow:hidden;background:var(--bg);margin:12px 0 4px}
.stack i{height:100%;transition:width 1s var(--ease)}
.stack i.over{background:repeating-linear-gradient(-45deg,var(--red) 0 6px,#d9614f 6px 12px)}
.stack-mark{position:relative;height:16px;font:600 10.5px/1 var(--mono);color:var(--muted)}
.stack-mark span{position:absolute;top:2px;transform:translateX(-100%);white-space:nowrap;padding-right:4px;border-right:2px solid var(--ink);height:14px;display:flex;align-items:center}
.legend{list-style:none;padding:0;margin:8px 0 0;font-size:14px}
.legend li{display:flex;align-items:center;gap:9px;padding:5px 0}
.legend .sw{width:12px;height:12px;border-radius:3px;flex:none}
.legend .v{margin-left:auto;font-family:var(--mono);font-weight:700}
.legend .p{width:78px;text-align:right;font:600 12px/1 var(--mono);color:var(--muted)}

/* ---------- Food ---------- */
.plate{display:flex;align-items:center;gap:16px;margin:6px 0 14px}
.plate svg{width:76px;height:76px;flex:none}
.plate .amt{font:800 44px/1 var(--mono);letter-spacing:-.03em}
.plate .per{font:600 12px/1.3 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:14px 0 10px}
.cal div{aspect-ratio:1;border-radius:9px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font:600 12px/1 var(--mono);color:var(--faint);transition:background .25s,color .25s,border-color .25s,transform .25s var(--ease)}
.cal div.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cal div.off{background:var(--red-soft);border-color:transparent;color:var(--red);text-decoration:line-through}
.cal div.last{transform:scale(1.12);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--red)}
.cal-key{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:16px}
.cal-key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.verdict{font-family:var(--serif);font-size:30px;line-height:1.1;font-weight:700;margin:4px 0 12px;opacity:0;transition:opacity .4s}
.verdict.show{opacity:1}

/* ---------- Results ---------- */
.big{font:800 64px/0.95 var(--sans);letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin:6px 0 6px}
.headline{font-family:var(--serif);font-size:32px;line-height:1.07;font-weight:700;margin:0 0 14px}
details.rec{margin:8px 0 0}
details.rec summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none;display:flex;align-items:center;gap:8px}
details.rec summary::-webkit-details-marker{display:none}
details.rec summary::after{content:"+";margin-left:auto;font:700 20px/1 var(--mono)}
details.rec[open] summary::after{content:"−"}
.receipt{position:relative;background:var(--paper);font:13.5px/1.55 var(--mono);padding:20px 18px 24px;margin:4px 0 26px;box-shadow:0 10px 24px -14px rgba(0,0,0,.3);animation:print 1s var(--ease) both}
@keyframes print{from{clip-path:inset(0 0 100% 0);transform:translateY(-12px)}to{clip-path:inset(0 0 -20px 0);transform:none}}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;background:radial-gradient(circle at 7px 10px,transparent 6.5px,var(--paper) 7px) 0 0/14px 10px repeat-x}
.receipt h3{font:700 13px/1.3 var(--mono);text-align:center;letter-spacing:.14em;margin:0}
.receipt .sub{text-align:center;color:var(--muted);font-size:12px;margin:2px 0 12px}
.receipt .rl{display:flex;gap:6px;align-items:baseline}
.receipt .rl .d{flex:1;border-bottom:1px dotted #bdb6a6;transform:translateY(-4px)}
.receipt .rl.tot{font-weight:700}
.receipt hr{border:0;border-top:1px dashed #bdb6a6;margin:8px 0}
.receipt .due{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;margin-top:10px}
.stamp{display:inline-block;transform:rotate(-8deg);border:2.5px solid var(--red);color:var(--red);font:800 15px/1 var(--mono);letter-spacing:.08em;padding:6px 8px;border-radius:6px;animation:stamp .35s .9s cubic-bezier(.3,1.6,.5,1) both}
.stamp.ok{border-color:var(--accent);color:var(--accent)}
@keyframes stamp{from{opacity:0;transform:rotate(-8deg) scale(1.8)}to{opacity:.9;transform:rotate(-8deg) scale(1)}}

/* ---------- Month-by-month chart ---------- */
.mstrip{display:flex;gap:10px;align-items:stretch}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.mval{font:800 15px/1.2 var(--mono);margin-bottom:6px}
.mup,.mdown{width:100%;display:flex;justify-content:center}
.mup{height:64px;align-items:flex-end;border-bottom:2px solid var(--ink)}
.mdown{align-items:flex-start}
.mbar{width:60%;max-width:56px}
.mbar.pos{background:var(--accent);border-radius:6px 6px 0 0}
.mbar.neg{background:var(--red);border-radius:0 0 6px 6px}
.mlab{font:700 12px/1.2 var(--mono);margin-top:8px}
.mev{font-size:12px;color:var(--muted);line-height:1.3;margin-top:2px}

/* ---------- The year ---------- */
.cardpill{font:700 11.5px/1.2 var(--mono);color:#fff;background:var(--red);border-radius:6px;padding:5px 7px;align-self:center;white-space:nowrap}
.cardpill span{opacity:.85;font-weight:600}
.cardpill.ok{background:var(--accent)}
.foodpill{font:700 11.5px/1.2 var(--mono);color:#fff;background:var(--accent);border-radius:6px;padding:5px 7px;align-self:center;white-space:nowrap}
.foodpill.short{background:var(--red)}
.mresult{display:flex;justify-content:space-between;align-items:baseline;border-radius:14px;padding:12px 16px;margin:0 0 10px;color:#fff;animation:rise .35s var(--ease) both}
.mresult.neg{background:var(--red)}
.mresult.pos{background:var(--accent)}
.mresult span{font:700 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.mresult b{font:800 30px/1 var(--mono);letter-spacing:-.02em}
.mfood{display:flex;gap:12px;align-items:center;border:2px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.mfood.short{border-color:var(--red);background:var(--red-soft)}
.mfood svg.i{width:30px;height:30px;flex:none}
.mfood.short svg.i{color:var(--red)}
.mfood b{display:block;font-size:16.5px}
.mfood.short b{color:var(--red)}
.mfood span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.mfood span.why{color:var(--red);font-weight:600;margin-top:4px}
.cardpill em{font-style:normal;margin-left:4px;padding-left:6px;border-left:1px solid rgba(255,255,255,.5)}
.ytrack{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:4px 0 18px}
.ym{position:relative;height:38px;border-radius:8px;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;font:700 12px/1 var(--mono);color:var(--faint);transition:background .3s,border-color .3s}
.ym.ok{background:var(--accent);border-color:var(--accent);color:#fff}
.ym.bad{background:var(--red);border-color:var(--red);color:#fff}
.ym.dip{background:var(--amber);border-color:var(--amber);color:#fff}
.mresult.dip{background:var(--amber)}
.ylegend{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin:-6px 0 12px;font-size:12px;color:var(--muted)}
.ylegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:-6px}
.ylegend i.ok{background:var(--accent)} .ylegend i.dip{background:var(--amber)} .ylegend i.bad{background:var(--red)}
.ym.now{border-color:var(--ink);border-width:2.5px;color:var(--ink)}
.ym .ev{position:absolute;top:-6px;right:-4px;width:15px;height:15px;border-radius:50%;background:var(--ink);color:#fff;font:800 10px/15px var(--mono);text-align:center;font-style:normal}
.ym .rf{position:absolute;bottom:-6px;right:-4px;width:15px;height:15px;border-radius:50%;background:#e9d9a6;color:var(--ink);font:800 10px/15px var(--mono);text-align:center;font-style:normal}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin:0 0 14px;animation:rise .35s var(--ease) both}
.ml{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.ml:last-child{border-bottom:0}
.ml b{font-family:var(--mono);white-space:nowrap}
.ml.plus b{color:var(--accent)}
.ml.muted{color:var(--muted)}
.ml.tot{font-weight:700}
.ml.tot b{font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile b{display:block;font:800 28px/1.1 var(--mono);letter-spacing:-.02em}
.tile b small{font-size:15px;color:var(--muted)}
.tile span{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.3}
.ychart{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:stretch}
.yc{display:flex;flex-direction:column;align-items:center}
.yc .yup{height:72px;width:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:2px solid var(--ink)}
.yc .ydn{height:72px;width:100%;display:flex;align-items:flex-start;justify-content:center}
.yc i{display:block;width:70%;border-radius:3px}
.yc .yup i{background:var(--accent);border-radius:3px 3px 0 0}
.yc .ydn i{background:var(--red);border-radius:0 0 3px 3px}
.yc span{font:700 11px/1 var(--mono);color:var(--muted);margin-top:4px}
.ygrid{display:flex;flex-direction:column;gap:3px}
.yrow{display:grid;grid-template-columns:30px repeat(30,1fr);gap:1.5px;align-items:center}
.yrow span{font:600 10px/1 var(--mono);color:var(--muted)}
.yrow i{aspect-ratio:1;border-radius:1.5px;background:var(--accent)}
.yrow i.x{background:var(--red)}
.pbar{margin:10px 0}
.pbar .row{display:flex;justify-content:space-between;font-size:15px;margin-bottom:5px}
.pbar .row b{font:800 17px/1 var(--mono)}
.pbar .row b.red{color:var(--red)}
.pbar .row b.acc{color:var(--accent)}
.pbar .track{height:14px;background:var(--bg);border-radius:7px;overflow:hidden}
.pbar .track i{display:block;height:100%;width:0;border-radius:7px;transition:width 1s var(--ease)}
.pbar .track i.red{background:var(--red)}
.pbar .track i.acc{background:var(--accent)}
.opt.nope[disabled]{opacity:.55;animation:none}

/* ---------- Same year, different help ---------- */
table.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
table.cmp th,table.cmp td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.cmp thead th{font:700 10px/1.2 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
table.cmp td.n,table.cmp th.n{text-align:right;font-family:var(--mono);font-weight:700;white-space:nowrap}
table.cmp td.red{color:var(--red)}
table.cmp td.accent{color:var(--accent)}
table.cmp tr.you th{font-weight:800}
table.cmp tr.all{background:var(--accent-soft)}
table.cmp tbody th{font-weight:600}
.helpcards{display:grid;gap:10px;margin:0 0 14px}
.helpcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.hc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hc-top b{font-size:16px}
.helpcard p{margin:0 0 6px;font-size:14.5px}
.helpcard p.real{margin:0;color:var(--red)}
.hc-k{font-weight:700}

/* ---------- Final ---------- */
.stat .big{font-size:76px}
.stat p{font-size:17px}
.closing{font-family:var(--serif);font-size:24px;line-height:1.2;font-weight:700;margin:22px 0 4px}
.credit{text-align:center;font:600 12px/1.4 var(--mono);letter-spacing:.06em;color:var(--faint);margin:28px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.sources{padding-left:18px;margin:0 0 16px}
.sources li{margin:0 0 12px;font-size:14px;word-break:break-word}
.sources a{color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 16px}

/* ---------- Edit mode (only with ?edit) ---------- */
[hidden]{display:none!important}
body.editing{padding-bottom:130px}
body.editmode .tk{cursor:text;border-radius:3px;transition:background .15s,box-shadow .15s}
body.editmode .tk:hover{background:rgba(29,107,82,.10);box-shadow:0 0 0 2px rgba(29,107,82,.35)}
body.editmode .tk.tk-changed{background:rgba(255,206,84,.38)}
body.editmode .tk.tk-locked:hover{background:rgba(0,0,0,.05);box-shadow:0 0 0 2px rgba(0,0,0,.15);cursor:not-allowed}
.tk-active{background:rgba(29,107,82,.2)!important}
#edbar{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#17201c;color:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px -12px rgba(0,0,0,.4);font:14px/1.3 var(--sans)}
#edbar .eb-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.eb-row{display:flex;gap:8px;align-items:center}
.eb-title{font:700 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#9fd3bd;white-space:nowrap}
.eb-switch{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;cursor:pointer}
.eb-switch input{width:16px;height:16px;accent-color:#3fa37f}
#edbar select{flex:1;min-width:0;background:#26302b;color:#fff;border:1px solid #3d4641;border-radius:8px;padding:7px 8px;font:inherit;font-size:13px}
#edbar button{flex:1;padding:10px 8px;border-radius:10px;border:1px solid #3d4641;background:#26302b;color:#fff;font:700 14px/1.2 var(--sans);cursor:pointer}
#edbar button.pri{background:var(--accent);border-color:var(--accent)}
#edbar .cnt{display:inline-block;min-width:20px;padding:2px 6px;border-radius:999px;background:#fff;color:#17201c;font-size:12px;margin-left:4px}
#ebChip{position:fixed;z-index:90;background:#17201c;color:#fff;border:0;border-radius:999px;padding:10px 15px;font:700 13px/1 var(--sans);box-shadow:0 8px 20px -8px rgba(0,0,0,.5);cursor:pointer;white-space:nowrap}
#ebPop{position:fixed;z-index:95;width:min(92vw,380px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 40px -18px rgba(0,0,0,.45);padding:12px;font:15px/1.45 var(--sans)}
.ep-head{display:flex;justify-content:space-between;align-items:center;font:700 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ep-x{border:0;background:none;font-size:16px;cursor:pointer;color:var(--muted)}
.ep-box{min-height:44px;border:1.5px solid var(--accent);border-radius:10px;padding:10px 12px;outline:none;background:var(--card);white-space:pre-wrap}
.ph{display:inline-block;padding:0 7px;margin:0 1px;border-radius:6px;background:#e7e3d9;color:var(--muted);font:600 12px/1.7 var(--mono);user-select:none;-webkit-user-select:none;vertical-align:1px}
.ep-hint{font-size:12.5px;color:var(--muted);margin:8px 0}
.ep-hint.err{color:var(--red);font-weight:600}
.ep-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ep-btns button{padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:700 14px/1.2 var(--sans);cursor:pointer;color:var(--ink)}
.ep-btns button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
#ebSheet{position:fixed;inset:0;z-index:100;background:rgba(23,32,28,.45);display:flex;align-items:flex-end;justify-content:center}
.sh-card{width:min(100%,560px);max-height:85vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));font:15px/1.45 var(--sans);animation:rise .3s var(--ease)}
.sh-card h4{margin:0 0 4px;font:700 20px/1.2 var(--serif)}
.sh-sub{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.sh-quote{border-left:3px solid var(--accent);background:var(--card);padding:8px 12px;border-radius:0 8px 8px 0;margin:0 0 10px;font-size:14px}
.sh-card textarea{width:100%;min-height:96px;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px;resize:vertical}
.sh-card textarea:focus{outline:none;border-color:var(--accent)}
.sh-item{border:1px solid var(--line);border-radius:10px;padding:10px 34px 10px 12px;margin:0 0 8px;font-size:14px;position:relative}
.sh-item .del{position:absolute;right:6px;top:6px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
.sh-meta{font:600 11px/1.3 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.sh-h{font:700 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.sh-empty{color:var(--muted);font-size:14px;margin:0 0 8px}
#ebToast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);z-index:110;background:#17201c;color:#fff;padding:11px 16px;border-radius:14px;font:600 14px/1.35 var(--sans);box-shadow:0 10px 24px -10px rgba(0,0,0,.5);width:max-content;max-width:90vw;text-align:center}

@media (max-width:360px){ h1{font-size:38px} h2{font-size:26px} .big{font-size:54px} }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition:none!important} }
</style>

<body>
<div class="app">
  <header class="meter idle" id="meter" aria-live="polite">
    <div class="meter-row">
      <span class="meter-label" id="meterLabel">Money left this month</span>
      <span class="day" id="day">DAY 1 / 30</span>
    </div>
    <div class="meter-main">
      <span class="meter-amt" id="meterAmt">$0</span>
      <span class="ebt" id="ebt" hidden></span>
      <span class="cardpill" id="cardPill" hidden></span>
      <span class="foodpill" id="foodPill" hidden></span>
      <span class="meter-delta" id="meterDelta"></span>
    </div>
    <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
  </header>
  <main id="screen"></main>
</div>

<script>
/* =====================================================================

  cities: {

      name: "Fargo, ND",

      },

      health: "aca",             // Parent earns too much for ND Medicaid (adults: $2,489/mo for 2, eff. Apr 1 2026, ND HHS) -> marketplace plan with the premium tax credit. Kid: ND CHIP
      kidHealth: "CHIP",

    },

      rent: {

        twoBR: 1709              // HUD FY2026 Fair Market Rent, 2BR, Minneapolis-St. Paul-Bloomington MSA
      },

      },

      stateMinWage: null,

    }
  },

  transport: {
    carMonthly: 350              // ESTIMATE — insurance + gas + payment on an older car
  },

  health: {
    // Parent's health insurance (the 4-year-old is covered at $0 in both states).
    fpl2025For2: 21150,          // HHS 2025 poverty guideline, household of 2 (2026 marketplace subsidies use the prior year's guideline)
    // IRS Rev. Proc. 2025-25, 2026 applicable percentage table: [from % FPL, to % FPL, initial %, final %] of income paid for the benchmark silver plan
    acaTable: [[0, 133, 2.10, 2.10], [133, 150, 3.14, 4.19], [150, 200, 4.19, 6.60], [200, 250, 6.60, 8.44], [250, 300, 8.44, 9.96], [300, 400, 9.96, 9.96]],

  food: {

const DEFAULTS = { config: JSON.parse(JSON.stringify(CONFIG)), text: Object.assign({}, TEXT) };
function getPath(obj, path) { return path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj); }
function setPath(obj, path, val) {
  const ks = path.split("."), last = ks.pop();
  const o = ks.reduce((a, k) => a[k], obj);
  if (o && last in o) o[last] = val;
}
function applyEdits(e) {
  for (const p in (e.config || {})) setPath(CONFIG, p, e.config[p]);
  for (const k in (e.text || {})) if (k in TEXT) TEXT[k] = e.text[k];

/* =====================================================================
   CALCULATIONS — pure functions (also used by test-paths.js)
   ===================================================================== */
// <calc>
function takeHomeFor(wage) {
  const gross = wage * CONFIG.hoursPerYear / 12;
  return { gross, net: gross * (1 - CONFIG.payrollTaxRate) };
}

function cardPayoff() {
  const s = CONFIG.surprise;
  let bal = s.amount, months = 0, total = 0;
  const r = s.cardAPR / 12;
  while (bal > 0.005 && months < 600) {
    bal += bal * r;
    const p = Math.min(s.cardMonthlyPayment, bal);
    bal -= p; total += p; months++;
  }
  return { months, total };
}

function surpriseCost(choice) {
  if (choice === "pay") return CONFIG.surprise.amount;
  if (choice === "card") return CONFIG.surprise.cardMonthlyPayment;
  return 0;
}

// Monthly SNAP benefit (federal formula). Returns 0 if over the gross income limit.
function snapBenefit(gross, rent, childCare) {
  const s = CONFIG.snap;
  if (gross > s.grossLimit2Person) return 0;
  const adjusted = Math.max(0, gross * (1 - s.earnedIncomeDeduction) - s.standardDeduction - childCare);
  const excessShelter = Math.min(s.excessShelterCap, Math.max(0, rent - adjusted / 2));
  const netIncome = Math.max(0, adjusted - excessShelter);
  return Math.max(0, Math.floor(s.max2Person - Math.ceil(s.benefitReduction * netIncome)));
}

// Parent's monthly health insurance premium for this city and gross monthly pay
function healthPremium(city, grossMonthly) {
  const H = CONFIG.health, annual = grossMonthly * 12;
  if (city.health === "mncare" && annual <= H.mnCare2[H.mnCare2.length - 1][0]) return H.mnCare2.find((b) => annual <= b[0])[1];
  const pct = annual / H.fpl2025For2 * 100;
  const row = H.acaTable.find((r) => pct < r[1]) || H.acaTable[H.acaTable.length - 1];
  const share = row[2] + (row[3] - row[2]) * Math.min(1, Math.max(0, (pct - row[0]) / (row[1] - row[0])));
  return Math.round(annual * share / 100 / 12);
}

function pathAtWage(city, c, wage) {
  const { gross, net } = takeHomeFor(wage);
  const housing = city.rent[c.housing];
  const care = city.childCare[c.care];
  const transport = c.transport === "car" ? CONFIG.transport.carMonthly : city.busPass;
  const health = healthPremium(city, gross);                               // parent's health insurance
  const basics = CONFIG.basicsMonthly + health;                            // "basics" = necessities + health insurance
  const surprise = surpriseCost(c.surprise);
  const leftover = net - housing - care - transport - basics - surprise;   // cash left after bills
  const snap = snapBenefit(gross, housing, care);                         // can only be spent on food
  const foodMoney = snap + Math.max(0, leftover);
  const need = CONFIG.food.usdaMonthly * (c.transport === "bus" ? 1 + CONFIG.food.convenienceMarkup : 1);
  const foodGap = Math.max(0, need - foodMoney);                          // short on groceries
  const billsBehind = Math.max(0, -leftover);                             // short on rent/bills (SNAP can't pay these)
  const shortfall = foodGap + billsBehind;
  const gap = shortfall > 0 ? shortfall : need - foodMoney;               // > 0 short, <= 0 = money to spare
  const gapNoSnap = need - leftover;                                      // same path, no SNAP
  const days = CONFIG.daysInMonth;
  const daysFed = Math.min(days, Math.floor(foodMoney / need * days));    // days the food budget covers
  const totalMeals = days * CONFIG.food.people * CONFIG.food.mealsPerDay;
  const perMeal = need / totalMeals;                                      // $ per person per meal
  const mealsSkipped = Math.min(totalMeals, Math.round(foodGap / perMeal));
  return { wage, gross, net, housing, care, transport, basics, health, surprise, leftover, snap, foodMoney, need, foodGap, billsBehind, gap, gapNoSnap, daysFed, totalMeals, perMeal, mealsSkipped };
}

function computePath(cityKey, c, wageOverride) {
  const city = CONFIG.cities[cityKey];
  const wage = wageOverride != null ? wageOverride : city.wage;
  const r = pathAtWage(city, c, wage);
  r.conscious = (c.housing === "oneBR") + (c.care === "home") + (c.transport === "bus") + (c.surprise === "pay");
  // Lowest wage (to the cent) that closes the gap. Scanned, because SNAP shrinks as pay rises
  // and drops to $0 at the income limit, so the relationship isn't a straight line.
  r.wageToClose = null;
  if (r.gap > 0) {
    for (let cents = Math.round(wage * 100) + 1; cents <= 10000; cents++) {
      if (pathAtWage(city, c, cents / 100).gap <= 0) { r.wageToClose = cents / 100; break; }
    }
  }
  return r;
}
/* ---------- A full year ----------
   Fair rules (no fudging):
   • Every month repeats the same pay, rent, child care, transport, basics, and SNAP (from the setup choices).
   • Emergencies are rolled at random each month from the Federal Reserve's real yearly odds (CONFIG.events).
     The rolls come from a seed, never from how the player is doing, so the game can't "pick on" anyone.
     The same seed always gives the same year (replay code).
   • When an emergency hits, the player pays from savings (if they have enough) or puts it on the credit card.
   • Each month: pay bills and the card's minimum payment; then emergencies; then food (SNAP first, then cash).
     If cash runs out, food is what gets cut (meals skipped). Bills that can't be paid pile up as "behind".
   • Tax refund arrives once, in March, computed from 2025 tax rules (taxRefund()).
   • Unused SNAP stays on the EBT card. Tax refunds don't count against SNAP. */

// Small seeded random number generator (mulberry32)
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Roll a whole year of emergencies from a seed. Same seed → same year. hasCar removes car repairs for bus riders.
function rollYear(seed, hasCar) {
  const r = rng(seed), year = [];
  for (let m = 0; m < CONFIG.year.months; m++) {
    const list = [];
    for (const e of CONFIG.events) {
      const p = 1 - Math.pow(1 - e.annualChance, 1 / 12);   // monthly chance that matches the yearly odds
      const hit = r(), amt = r();                            // always draw both so sequences stay aligned
      if (e.carOnly && !hasCar) continue;
      if (hit < p) list.push({ id: e.id, cost: Math.round((e.min + amt * (e.max - e.min)) / 10) * 10 });
    }
    year.push(list);
  }
  return year;
}

// Yearly tax refund (2025 tax year rules), for a full-time worker with one child, head of household.
function taxRefund(cityKey, wage, careMonthly) {
  const T = CONFIG.tax;
  const earned = wage * CONFIG.hoursPerYear, agi = earned;
  const eitc = Math.max(0, Math.min(T.eitc.rate * earned, T.eitc.max) - T.eitc.phaseoutRate * Math.max(0, agi - T.eitc.phaseoutStart));
  const taxable = Math.max(0, agi - T.stdDeductionHoH);
  const incomeTax = Math.min(taxable, T.bracket10Top) * 0.10 + Math.max(0, taxable - T.bracket10Top) * 0.12;
  const steps = Math.max(0, Math.ceil((agi - T.cdctc.startAGI) / T.cdctc.step));
  const cdRate = Math.max(T.cdctc.minRate, T.cdctc.maxRate - 0.01 * steps);
  const careCredit = Math.min(incomeTax, cdRate * Math.min(T.cdctc.expenseLimit, careMonthly * 12));   // nonrefundable
  const tax2 = incomeTax - careCredit;
  const ctcUsed = Math.min(T.ctc.perChild, tax2);                                                    // nonrefundable part
  const actc = Math.min(T.ctc.perChild - ctcUsed, T.ctc.refundableMax, T.ctc.earnedRate * Math.max(0, earned - T.ctc.earnedFloor));
  const federal = eitc + actc - (tax2 - ctcUsed);
  let mnCredits = 0, mnTax = 0;
  if (cityKey === "minneapolis") {
    const M = T.mn;
    mnTax = Math.max(0, agi - M.stdDeductionHoH) * M.rate1;
    mnCredits = Math.max(0, M.ctcPerChild + M.wfcRate * Math.min(earned, M.wfcEarnedCap) - M.phaseoutRate * Math.max(0, Math.max(earned, agi) - M.phaseoutStart));
  }
  const total = federal + mnCredits - mnTax;
  return { eitc, actc, careCredit, incomeTax, ctcUsed, federal, mnCredits, mnTax, total: Math.round(total) };
}

function cardMinPayment(balance) {
  const C = CONFIG.card;
  if (balance <= 0.005) return { interest: 0, pay: 0 };
  const interest = balance * C.apr / 12;
  const pay = Math.min(balance + interest, Math.max(C.minPaymentFloor, interest + C.minPaymentPct * balance));
  return { interest, pay };
}

// Default way to handle an emergency (used for the 1,000-year summary, and never for the player's own choices):
// use savings if that still leaves this month's food money, otherwise the card.
function defaultPolicy(ev, st) { return st.cash - ev.cost >= st.foodCashNeeded ? "savings" : "card"; }

/* Simulate the year.
   choices: { "m-i": "savings" | "card" } for the player's decisions (month m, i-th emergency that month).
   opts: { policy, noSnap, wage }. If a decision is missing and there is no policy, stops and returns { pending }. */
function simulateYear(cityKey, c, startSavings, seed, choices, opts) {
  opts = opts || {};
  const city = CONFIG.cities[cityKey];
  const wage = opts.wage != null ? opts.wage : city.wage;
  let base = pathAtWage(city, Object.assign({}, c, { surprise: undefined }), wage);
  if (opts.careCost != null) {                    // "what if": child care subsidy with a capped copay
    base = Object.assign({}, base, { care: Math.min(base.care, opts.careCost) });
    base.snap = snapBenefit(base.gross, base.housing, base.care);
  }
  const snap = opts.noSnap ? 0 : base.snap;
  const fixed = base.housing + base.care + base.transport + base.basics;
  const refund = taxRefund(cityKey, wage, base.care);
  const events = rollYear(seed, c.transport === "car");
  const days = CONFIG.daysInMonth;
  let cash = startSavings, card = 0, behind = 0, snapCarry = 0, interestPaid = 0;
  const months = [];
  for (let m = 0; m < CONFIG.year.months; m++) {
    const rec = { m, startCash: cash, startCard: card, startBehind: behind, events: [], refund: 0 };
    // 1) Paycheck (and tax refund in March)
    cash += base.net;
    if (opts.ctc2021) {   // "what if": the 2021 Child Tax Credit, paid monthly. It replaces this year's CTC; the rest of the refund still comes in March
      rec.refund = CONFIG.help.ctc2021PerYoungChild / 12;
      if (m === CONFIG.year.refundMonth) rec.refund += refund.total - refund.ctcUsed - refund.actc;
      cash += rec.refund;
    }
    else if (m === CONFIG.year.refundMonth) { rec.refund = refund.total; cash += refund.total; }
    // 2) Bills, then the card's minimum payment
    cash -= fixed;
    const cp = cardMinPayment(card);
    card += cp.interest; interestPaid += cp.interest;
    rec.cardInterest = cp.interest; rec.cardPay = cp.pay;
    cash -= cp.pay; card -= cp.pay;
    rec.behindAdded = 0;
    if (cash < 0) { rec.behindAdded = -cash; behind += -cash; cash = 0; }
    // 3) Emergencies
    const snapAvail = snap + snapCarry;
    const need = base.need;
    const foodCashNeeded = Math.max(0, need - snapAvail);
    for (let i = 0; i < events[m].length; i++) {
      const ev = events[m][i];
      let how = choices && choices[m + "-" + i];
      if (how === "savings" && cash < ev.cost) how = "card";
      if (!how) {
        if (opts.policy) how = cash >= ev.cost ? opts.policy(ev, { cash, foodCashNeeded }) : "card";
        else { months.push(Object.assign(rec, { partial: true })); return { months, pending: { m, i, ev, cash }, refund, base, card, cash, behind, interestPaid, events }; }
      }
      if (how === "savings") cash -= ev.cost; else card += ev.cost;
      rec.events.push(Object.assign({}, ev, { how }));
    }
    // 4) Food: SNAP first, then cash. Whatever's missing is skipped meals.
    const snapUsed = Math.min(snapAvail, need);
    snapCarry = snapAvail - snapUsed;
    const cashFood = Math.min(cash, need - snapUsed);
    cash -= cashFood;
    rec.snapUsed = snapUsed; rec.cashFood = cashFood;
    rec.foodGap = Math.max(0, need - snapUsed - cashFood);
    rec.mealsSkipped = Math.min(base.totalMeals, Math.round(rec.foodGap / base.perMeal));
    rec.daysFed = Math.min(days, Math.floor((snapUsed + cashFood) / need * days));
    // 5) Catch up on bills you were behind on, if money is left
    if (cash > 0 && behind > 0) { const p = Math.min(cash, behind); cash -= p; behind -= p; rec.behindPaid = p; }
    rec.endCash = cash; rec.endCard = card; rec.endBehind = behind;
    months.push(rec);
  }
  return { months, pending: null, refund, base, card, cash, behind, interestPaid, events,
    netWorth: cash - card - behind,
    mealsSkipped: months.reduce((a, r) => a + r.mealsSkipped, 0),
    shortMonths: months.filter((r) => r.foodGap > 0.005).length };
}

function startSavingsAmount(opt, cityKey, c, wage) {
  if (opt !== "3mo") return Number(opt) || 0;
  const city = CONFIG.cities[cityKey];
  const b = pathAtWage(city, Object.assign({}, c, { surprise: undefined }), wage != null ? wage : city.wage);
  return Math.round((b.housing + b.care + b.transport + b.basics + b.need) * 3 / 10) * 10;   // 3 months of expenses
}

// Replay the same household many times with new random years (default policy for emergencies)
function manyYears(cityKey, c, startSavings, opts) {
  opts = opts || {};
  const n = opts.runs || CONFIG.year.runs, out = [];
  for (let k = 0; k < n; k++) {
    const y = simulateYear(cityKey, c, startSavings, 1000003 + k * 7919, null, { policy: defaultPolicy, wage: opts.wage, noSnap: opts.noSnap });
    out.push({ debt: y.card + y.behind, cash: y.cash, net: y.netWorth, meals: y.mealsSkipped, shortMonths: y.shortMonths, events: y.events.reduce((a, l) => a + l.length, 0) });
  }
  const pct = (f) => Math.round(out.filter(f).length / n * 100);
  const median = (arr) => { const s = arr.slice().sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };
  return {
    runs: n, results: out,
    pctDebt: pct((x) => x.debt > 1), pctHungry: pct((x) => x.meals > 0), pctNoEvent: pct((x) => x.events === 0),
    medianDebt: median(out.map((x) => x.debt)), medianNet: median(out.map((x) => x.net)), medianMeals: median(out.map((x) => x.meals))
  };
}

/* ---------- Meter ---------- */
let meterShown = 0, meterRaf = null, deltaTimer = null;
function meterMax() { return S.city ? takeHomeFor(S.wageOverride ?? city().wage).net : 1; }
function cashBalance() {
  if (!S.city) return null;
  if ((S.screen === "year" || S.screen === "results") && S.y) {
    const sim = yearSim();
    // Where you stand = cash minus credit card debt minus bills you're behind on
    if (S.y.panel && S.y.panel.type === "event") return sim.pending ? sim.pending.cash - sim.card - sim.behind : sim.netWorth;
    if (S.y.shown < 0) return yearStart();
    const r = sim.months[S.y.shown];
    return r ? r.endCash - r.endCard - r.endBehind : sim.netWorth;
  }
  const c = S.c, ct = city();
  let bal = meterMax();
  if (c.housing) bal -= ct.rent[c.housing];
  if (c.care) bal -= ct.childCare[c.care];
  if (c.transport) bal -= c.transport === "car" ? CONFIG.transport.carMonthly : ct.busPass;
  if (c.basics) bal -= path().basics;
  if (c.surprise) bal -= surpriseCost(c.surprise);
  return bal;
}
function updateMeter() {

    const r = sh >= 0 ? sim.months[sh] : null;

    cp.hidden = false;
    cp.className = "cardpill" + (bal >= 1 || behind >= 1 ? "" : " ok");
    cp.innerHTML = `CASH <b>${fmt(cash)}</b>` + (bal >= 1 ? ` <em>CARD ${fmt(bal)} · ${fmt(cardMinPayment(bal).pay)}/mo</em>` : "") + (behind >= 1 ? ` <em>BEHIND ${fmt(behind)}</em>` : "");
    const fp = $("foodPill");
    if (r && !p) { fp.hidden = false; fp.className = "foodpill" + (r.daysFed < CONFIG.daysInMonth ? " short" : ""); fp.innerHTML = `FOOD <b>${r.daysFed}/${CONFIG.daysInMonth}</b> DAYS`; }
    else fp.hidden = true;

    $("day").textContent = `DAY ${DAY[S.screen] || 1} / ${CONFIG.daysInMonth}`;
  }
  if (S.c.snap) { const s = path().snap; ebt.hidden = false; ebt.textContent = s > 0 ? `+ ${fmt(s)} EBT` : "EBT $0"; }
  else ebt.hidden = true;
  const pctLeft = target / meterMax() * 100;
  fill.style.width = Math.max(0, Math.min(100, pctLeft)) + "%";
  fill.classList.toggle("low", pctLeft < 15);
  const from = meterShown, diff = target - from;
  if (Math.abs(diff) < 0.5) { amt.textContent = fmt(target); return; }
  d.textContent = (diff < 0 ? "−" : "+") + fmt(Math.abs(diff));
  d.className = "meter-delta show " + (diff < 0 ? "down" : "up");
  clearTimeout(deltaTimer); deltaTimer = setTimeout(() => d.classList.remove("show"), 1700);
  amt.classList.remove("bump"); void amt.offsetWidth; amt.classList.add("bump");
  cancelAnimationFrame(meterRaf);
  const dur = reduceMotion ? 0 : 800, t0 = performance.now();
  const tick = (now) => {
    const k = dur ? Math.min(1, (now - t0) / dur) : 1;
    const v = k < 1 ? from + diff * (1 - Math.pow(1 - k, 3)) : target;
    meterShown = v;
    amt.textContent = fmt(v);
    amt.classList.toggle("neg", v < -0.5);
    if (k < 1) meterRaf = requestAnimationFrame(tick);
  };
  meterRaf = requestAnimationFrame(tick);
}

// Shift blocks: segs = [{v: shifts, color}], total = shifts in a full-time month
function shiftBlocks(segs, total) {
  const sum = segs.reduce((a, s) => a + s.v, 0);
  const cells = Math.max(Math.ceil(total - 1e-9), Math.ceil(sum - 1e-9));
  let html = "";
  for (let k = 0; k < cells; k++) {
    const stops = []; let acc = 0;
    for (const s of segs) {
      const a = Math.max(k, acc), b = Math.min(k + 1, acc + s.v);
      if (b > a) stops.push(`${s.color} ${((a - k) * 100).toFixed(1)}% ${((b - k) * 100).toFixed(1)}%`);
      acc += s.v;
    }
    const filled = Math.min(1, Math.max(0, sum - k));
    if (filled < 1) stops.push(`transparent ${(filled * 100).toFixed(1)}% 100%`);
    const bg = stops.length ? `background-image:linear-gradient(90deg,${stops.join(",")})` : "";
    html += `<i class="${k >= Math.ceil(total - 1e-9) ? "extra" : ""}" style="${bg}"></i>`;
  }
  return `<div class="shifts">${html}</div>`;
}
